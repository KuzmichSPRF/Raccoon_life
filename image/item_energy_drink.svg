<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="canBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="canRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="64" cy="64" r="58" fill="url(#bgGlow)"/>

  <!-- Can Silhouette -->
  <!-- Top Rim -->
  <ellipse cx="64" cy="28" rx="22" ry="7" fill="url(#canRim)" stroke="#cbd5e1" stroke-width="1.5"/>
  <ellipse cx="64" cy="27" rx="16" ry="4" fill="#334155"/>
  <ellipse cx="64" cy="27" rx="5" ry="2" fill="#0f172a"/>

  <!-- Main Can Body -->
  <path d="M42 28 C42 28, 41 34, 41 38 L41 94 C41 103, 50 108, 64 108 C78 108, 87 103, 87 94 L87 38 C87 34, 86 28, 86 28 Z" fill="url(#canBody)" stroke="rgba(0, 229, 255, 0.6)" stroke-width="2" filter="url(#glow)"/>

  <!-- Light Reflection Stripe -->
  <path d="M46 34 L46 96 C46 98, 49 102, 53 103 L53 35 Z" fill="rgba(255,255,255,0.22)"/>

  <!-- Energy Lightning Bolt -->
  <polygon points="67,42 53,66 63,66 57,92 77,62 66,62" fill="url(#boltGrad)" filter="url(#glow)"/>

  <!-- Bottom Rim -->
  <ellipse cx="64" cy="98" rx="23" ry="7" fill="none" stroke="url(#canRim)" stroke-width="2"/>

  <!-- Sparkles -->
  <circle cx="32" cy="40" r="2.5" fill="#00e5ff" filter="url(#glow)"/>
  <circle cx="95" cy="78" r="2" fill="#fde047" filter="url(#glow)"/>
  <circle cx="92" cy="36" r="3" fill="#00e5ff" filter="url(#glow)"/>
</svg>
