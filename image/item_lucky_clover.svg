<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="cloverGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leafGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </radialGradient>
    <radialGradient id="goldRim" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="64" cy="64" r="58" fill="url(#cloverGlow)"/>

  <!-- Golden Pog Base -->
  <circle cx="64" cy="64" r="48" fill="#14532d" stroke="url(#goldRim)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="42" fill="#052e16" stroke="rgba(250, 204, 21, 0.4)" stroke-width="1.5"/>

  <!-- 4 Clover Leaves (Heart shapes rotated) -->
  <!-- Top Leaf -->
  <path d="M64 64 C52 42, 42 28, 54 20 C64 14, 64 30, 64 36 C64 30, 64 14, 74 20 C86 28, 76 42, 64 64 Z" fill="url(#leafGrad)" stroke="#86efac" stroke-width="1" filter="url(#glow)"/>

  <!-- Bottom Leaf -->
  <path d="M64 64 C52 86, 42 100, 54 108 C64 114, 64 98, 64 92 C64 98, 64 114, 74 108 C86 100, 76 86, 64 64 Z" fill="url(#leafGrad)" stroke="#86efac" stroke-width="1" filter="url(#glow)"/>

  <!-- Left Leaf -->
  <path d="M64 64 C42 52, 28 42, 20 54 C14 64, 30 64, 36 64 C30 64, 14 64, 20 74 C28 86, 42 76, 64 64 Z" fill="url(#leafGrad)" stroke="#86efac" stroke-width="1" filter="url(#glow)"/>

  <!-- Right Leaf -->
  <path d="M64 64 C86 52, 100 42, 108 54 C114 64, 98 64, 92 64 C98 64, 114 64, 108 74 C100 86, 86 76, 64 64 Z" fill="url(#leafGrad)" stroke="#86efac" stroke-width="1" filter="url(#glow)"/>

  <!-- Center Emerald Gem -->
  <circle cx="64" cy="64" r="7" fill="#fde047" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Sparkles -->
  <path d="M96 28 L98 34 L104 36 L98 38 L96 44 L94 38 L88 36 L94 34 Z" fill="#fde047" filter="url(#glow)"/>
  <circle cx="28" cy="92" r="2.5" fill="#86efac" filter="url(#glow)"/>
</svg>
