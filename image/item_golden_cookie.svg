<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="cookieGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cookieBody" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="90%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="goldChip" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="64" cy="64" r="58" fill="url(#cookieGlow)"/>

  <!-- Main Golden Cookie Base -->
  <path d="M64 16 C88 15, 110 32, 111 58 C112 84, 94 110 66 112 C38 114, 16 94, 17 66 C18 40, 38 17, 64 16 Z" fill="url(#cookieBody)" stroke="#fef08a" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Texture Bite & Cracks -->
  <path d="M42 38 Q48 46 54 44" stroke="#92400e" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M72 82 Q80 84 86 78" stroke="#92400e" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M34 74 Q42 70 46 76" stroke="#92400e" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Shiny Golden Chunks / Chips -->
  <circle cx="48" cy="40" r="7" fill="url(#goldChip)" filter="url(#glow)"/>
  <circle cx="82" cy="44" r="8" fill="url(#goldChip)" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="9" fill="url(#goldChip)" filter="url(#glow)"/>
  <circle cx="40" cy="78" r="6.5" fill="url(#goldChip)" filter="url(#glow)"/>
  <circle cx="78" cy="84" r="7.5" fill="url(#goldChip)" filter="url(#glow)"/>
  <circle cx="88" cy="66" r="5" fill="url(#goldChip)" filter="url(#glow)"/>

  <!-- Sparkles -->
  <path d="M102 24 L105 32 L113 35 L105 38 L102 46 L99 38 L91 35 L99 32 Z" fill="#ffffff" filter="url(#glow)"/>
  <path d="M24 88 L26 94 L32 96 L26 98 L24 104 L22 98 L16 96 L22 94 Z" fill="#fde047" filter="url(#glow)"/>
</svg>
