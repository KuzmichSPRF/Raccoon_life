<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎰 Енотная Рулетка</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #E53935;
      --accent: #FF3B30;
      --bg-primary: #121214;
      --bg-secondary: #18181A;
      --bg-elevated: #222224;
      --bg-elevated-hover: #2c2c30;
      --text-main: #FFFFFF;
      --text-muted: #E5E5EA;
      --text-sec: rgba(255, 255, 255, 0.6);
      --game-green: #33BD1C;
      --gold: #FFD700;
      --win: #33BD1C;
      --lose: #E53935;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-gold: rgba(255, 215, 0, 0.35);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: var(--bg-primary);
      background-image: radial-gradient(circle at 50% 0%, rgba(229, 57, 53, 0.12) 0%, transparent 60%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 12px 20px;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--bg-secondary);
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sound-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-main);
      transition: transform 0.1s;
    }
    .sound-btn:active { transform: scale(0.92); }
    
    .balance-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--gold);
      background: rgba(255, 215, 0, 0.08);
      border: 1px solid rgba(255, 215, 0, 0.25);
      padding: 6px 12px;
      border-radius: 12px;
    }
    .cone-icon {
      width: 18px;
      height: 18px;
      object-fit: contain;
      vertical-align: middle;
      filter: drop-shadow(0 0 6px rgba(255, 180, 0, 0.6));
    }

    /* Compact Horizontal Sector Roulette Reel */
    .roulette-reel-card {
      background: var(--bg-secondary);
      border: 1.5px solid var(--border-gold);
      border-radius: 20px;
      padding: 10px;
      position: relative;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 215, 0, 0.04);
      overflow: hidden;
    }
    .reel-viewport {
      position: relative;
      width: 100%;
      height: 84px;
      overflow: hidden;
      border-radius: 14px;
      background: #0d0d10;
      display: flex;
      align-items: center;
    }
    .reel-pointer-top, .reel-pointer-bottom {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: 0;
      height: 0;
      filter: drop-shadow(0 0 8px #ff3b30);
    }
    .reel-pointer-top {
      top: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 12px solid #ff3b30;
    }
    .reel-pointer-bottom {
      bottom: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 12px solid #ff3b30;
    }
    .reel-center-line {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, #ff3b30 0%, rgba(255, 59, 48, 0.4) 50%, #ff3b30 100%);
      transform: translateX(-50%);
      z-index: 15;
      box-shadow: 0 0 10px #ff3b30;
      pointer-events: none;
    }
    .reel-shadow-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      background: linear-gradient(90deg, #0d0d10 0%, rgba(13,13,16,0) 18%, rgba(13,13,16,0) 82%, #0d0d10 100%);
    }
    .reel-track {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0;
      will-change: transform;
      position: absolute;
      left: 0;
      top: 8px;
    }
    .reel-item {
      width: 68px;
      height: 68px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.15rem;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.12);
      transition: transform 0.2s, border-color 0.2s;
    }
    .reel-item--red {
      background: linear-gradient(145deg, #ff4444, #c62828);
      color: #fff;
    }
    .reel-item--black {
      background: linear-gradient(145deg, #2a2a2e, #18181a);
      color: #fff;
      border-color: rgba(255,255,255,0.2);
    }
    .reel-item--green {
      background: linear-gradient(145deg, #00e676, #1b5e20);
      color: #000;
      font-size: 1.35rem;
      border-color: #69f0ae;
    }
    .reel-item--jackpot {
      background: linear-gradient(145deg, #ffd700, #ff8f00);
      color: #000;
      border-color: #fff;
      box-shadow: 0 0 16px rgba(255, 215, 0, 0.6);
    }
    .reel-item--mega_cone {
      background: linear-gradient(145deg, #a855f7, #06b6d4);
      color: #fff;
      border-color: #e9d5ff;
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.6);
    }
    .reel-item.is-winner {
      transform: scale(1.06);
      border-color: #fff;
      box-shadow: 0 0 20px #ffd700;
      z-index: 5;
    }

    /* Result Banner */
    .result-banner {
      background: var(--bg-secondary);
      border-radius: 14px;
      padding: 10px 14px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.88rem;
      text-align: center;
      border: 1px solid var(--border-subtle);
      transition: all 0.2s ease;
    }
    .result-win {
      color: #00ff88;
      border-color: rgba(0, 255, 136, 0.45);
      background: linear-gradient(135deg, rgba(0, 255, 136, 0.12), var(--bg-secondary));
      box-shadow: 0 0 16px rgba(0, 255, 136, 0.2);
    }
    .result-lose {
      color: #ff5252;
      border-color: rgba(229, 57, 53, 0.45);
      background: linear-gradient(135deg, rgba(229, 57, 53, 0.12), var(--bg-secondary));
    }

    /* Bet Choice Cards */
    .bet-grid {
      display: grid;
      grid-template-columns: 1fr 0.9fr 1fr;
      gap: 8px;
    }
    .bet-choice-card {
      background: var(--bg-secondary);
      border: 1.5px solid var(--border-subtle);
      border-radius: 14px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      min-height: 56px;
      min-width: 0;
      box-sizing: border-box;
      overflow: hidden;
    }
    .bet-choice-card:active { transform: scale(0.96); }
    .bet-choice-card.active {
      transform: scale(1.02);
      border-color: var(--gold);
      box-shadow: 0 0 16px rgba(255, 215, 0, 0.35);
    }
    .bet-choice-card--red.active { border-color: #ff4444; box-shadow: 0 0 16px rgba(255, 68, 68, 0.45); }
    .bet-choice-card--green.active { border-color: #00ff88; box-shadow: 0 0 16px rgba(0, 255, 136, 0.45); }
    .bet-choice-card--black.active { border-color: #aaa; box-shadow: 0 0 16px rgba(255, 255, 255, 0.3); }

    .bet-choice-title {
      font-weight: 900;
      font-size: clamp(0.72rem, 3.2vw, 0.85rem);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      box-sizing: border-box;
    }
    .bet-choice-mult {
      font-size: clamp(0.65rem, 2.8vw, 0.72rem);
      font-weight: 700;
      color: var(--text-sec);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      box-sizing: border-box;
    }

    /* Bet Amount Controls */
    .bet-control-panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bet-input-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .step-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: white;
      font-weight: 800;
      font-size: 1.1rem;
      width: 44px;
      height: 42px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-sizing: border-box;
      transition: background 0.15s;
    }
    .step-btn:active { transform: scale(0.94); background: var(--bg-elevated-hover); }
    .bet-input-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      min-width: 0;
    }
    .bet-input-field {
      width: 100%;
      height: 42px;
      background: var(--bg-elevated);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 12px;
      color: var(--gold);
      font-size: 1.1rem;
      font-weight: 800;
      text-align: center;
      outline: none;
      padding: 0 30px 0 10px;
      box-sizing: border-box;
      min-width: 0;
    }
    .bet-input-field:focus {
      border-color: var(--gold);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
    }
    .bet-input-icon {
      position: absolute;
      right: 10px;
      pointer-events: none;
    }

    /* Preset Chips */
    .preset-chips-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .preset-chip {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 6px 1px;
      font-size: clamp(0.62rem, 2.5vw, 0.72rem);
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.12s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      box-sizing: border-box;
    }
    .preset-chip:active { transform: scale(0.92); background: var(--primary); color: white; border-color: var(--primary); }

    /* Play CTA Button */
    .spin-cta-btn {
      background: linear-gradient(135deg, #ff4444 0%, #d32f2f 100%);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 12px 14px;
      font-size: clamp(0.85rem, 4vw, 1.05rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(229, 57, 53, 0.45);
      transition: transform 0.12s, box-shadow 0.12s, opacity 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 48px;
      box-sizing: border-box;
      overflow: hidden;
    }
    .spin-cta-btn > span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .spin-cta-btn:active { transform: scale(0.97); }
    .spin-cta-btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

    /* History and Info */
    .history-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .history-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: var(--text-sec);
      text-transform: uppercase;
      font-weight: 700;
    }
    .history-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .hist-pill {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.72rem;
      flex-shrink: 0;
    }
    .hist-pill--red { background: #E53935; color: #fff; }
    .hist-pill--black { background: #262628; border: 1px solid rgba(255,255,255,0.15); color: #fff; }
    .hist-pill--green { background: #33BD1C; color: #fff; }
    .hist-pill--jackpot { background: #ffd700; color: #000; }
    .hist-pill--mega_cone { background: linear-gradient(135deg, #a855f7, #06b6d4); color: #fff; border: 1px solid #c084fc; box-shadow: 0 0 6px rgba(168,85,247,0.5); }

    .info-footer {
      font-size: 0.72rem;
      color: var(--text-sec);
      text-align: center;
      line-height: 1.4;
      padding: 4px 6px;
    }
    .info-footer strong { color: var(--gold); }
  </style>
</head>
<body>
  <!-- Звук рулетки -->
  <audio id="roulette-music" loop>
    <source src="https://github.com/KuzmichSPRF/QT2/raw/refs/heads/main/nyan-cat-nyan-cat-theme-48244995_XsRPjGuA.mp3" type="audio/mpeg">
  </audio>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-title">
        <span>🎰</span>
        <span id="ui-title">Енотная Рулетка</span>
      </div>
      <div class="header-controls">
        <button class="sound-btn" id="sound-toggle-btn" onclick="toggleSound()" title="Звук">🔊</button>
        <div class="balance-badge">
          <img src="images/cone.png" class="cone-icon" alt="🌰">
          <span id="balance">0</span>
        </div>
      </div>
    </header>

    <!-- Compact Horizontal Animated Sector Roulette Reel -->
    <div class="roulette-reel-card">
      <div class="reel-viewport" id="reel-viewport">
        <div class="reel-pointer-top"></div>
        <div class="reel-pointer-bottom"></div>
        <div class="reel-center-line"></div>
        <div class="reel-shadow-overlay"></div>
        <div class="reel-track" id="reel-track">
          <!-- Items populated by JS -->
        </div>
      </div>
    </div>

    <!-- Result Banner -->
    <div class="result-banner" id="result-box">
      Выберите ставку (мин. 1,000) и крутите рулетку!
    </div>

    <!-- Bet Choice Cards -->
    <div class="bet-grid">
      <div class="bet-choice-card bet-choice-card--red" id="bet-card-red" onclick="selectBet('red')">
        <div class="bet-choice-title" style="color: #ff4444;">🔴 <span id="lbl-red">Красное</span></div>
        <div class="bet-choice-mult">x2 (47%)</div>
      </div>
      <div class="bet-choice-card bet-choice-card--green" id="bet-card-green" onclick="selectBet('green')">
        <div class="bet-choice-title" style="color: #00ff88;">🟢 <span id="lbl-green">Зеро</span></div>
        <div class="bet-choice-mult">x14 (6%)</div>
      </div>
      <div class="bet-choice-card bet-choice-card--black" id="bet-card-black" onclick="selectBet('black')">
        <div class="bet-choice-title" style="color: #ddd;">⚫ <span id="lbl-black">Чёрное</span></div>
        <div class="bet-choice-mult">x2 (47%)</div>
      </div>
    </div>

    <!-- Bet Controls & Chips -->
    <div class="bet-control-panel">
      <div class="bet-input-row">
        <button class="step-btn" onclick="adjustBet(-1000)">-</button>
        <div class="bet-input-wrap">
          <input type="number" id="bet-amount-input" class="bet-input-field" value="1000" min="1000" step="500" oninput="onBetInputChange()">
          <img src="images/cone.png" class="cone-icon bet-input-icon" alt="🌰">
        </div>
        <button class="step-btn" onclick="adjustBet(1000)">+</button>
      </div>

      <!-- Quick Preset Chips -->
      <div class="preset-chips-row">
        <button class="preset-chip" onclick="setBet(1000)">1k</button>
        <button class="preset-chip" onclick="setBet(5000)">5k</button>
        <button class="preset-chip" onclick="setBet(10000)">10k</button>
        <button class="preset-chip" onclick="setBet(25000)">25k</button>
        <button class="preset-chip" onclick="multiplyBet(0.5)">1/2</button>
        <button class="preset-chip" onclick="multiplyBet(2)">2X</button>
        <button class="preset-chip" onclick="setBetMax()">MAX</button>
      </div>
    </div>

    <!-- Spin CTA Button -->
    <button class="spin-cta-btn" id="spin-btn" onclick="spin()" disabled>
      <span>🎲</span>
      <span id="spin-btn-text">КРУТИТЬ РУЛЕТКУ!</span>
    </button>

    <!-- History Bar -->
    <div class="history-card">
      <div class="history-head">
        <span id="lbl-history">📊 Последние раунды</span>
        <span id="stats-win-rate" style="color: var(--gold);">Побед: 0</span>
      </div>
      <div class="history-pills" id="history-list">
        <!-- History items -->
      </div>
    </div>

    <!-- Info Footer -->
    <div class="info-footer">
      🎰 RTP: <strong>95%</strong> | 💎 Джекпот <strong>x100</strong> (0.1%) | 🌟 <strong>МЕГАШИШКА (+1 ур. Дупла)</strong> (1.5%)
    </div>
  </div>

  <script>
    let lang = localStorage.getItem('rl_lang') || 'ru';
    const translations = {
      ru: {
        title: "Енотная Рулетка",
        prompt: "Выберите ставку (мин. 1,000) и крутите рулетку!",
        red: "Красное",
        green: "Зеро",
        black: "Чёрное",
        spin: "КРУТИТЬ РУЛЕТКУ!",
        spinning: "ВРАЩЕНИЕ...",
        history: "📊 Последние раунды",
        wins: "Побед: ",
        noCones: "❌ Недостаточно шишек на балансе!",
        minBet: "❌ Минимальная ставка: 1,000 шишек!",
        winText: "🎉 ПОБЕДА! +",
        loseText: "😢 Проигрыш -",
        jackpotText: "💎 ДЖЕКПОТ! x100! +",
        megaConeWin: "🌟 ВЫБИТА МЕГАШИШКА! (+1 УРОВЕНЬ ДУПЛА)"
      },
      en: {
        title: "Raccoon Roulette",
        prompt: "Place your bet (min 1,000) and spin the wheel!",
        red: "Red",
        green: "Zero",
        black: "Black",
        spin: "SPIN ROULETTE!",
        spinning: "SPINNING...",
        history: "📊 Recent Rounds",
        wins: "Wins: ",
        noCones: "❌ Not enough cones on balance!",
        minBet: "❌ Minimum bet: 1,000 cones!",
        winText: "🎉 VICTORY! +",
        loseText: "😢 Defeat -",
        jackpotText: "💎 JACKPOT! x100! +",
        megaConeWin: "🌟 WON MEGA CONE! (+1 HOLLOW LEVEL)"
      }
    };
    let t = translations[lang] || translations.ru;

    function applyLang(selectedLang) {
      lang = selectedLang || 'ru';
      t = translations[lang] || translations.ru;
      
      const titleEl = document.getElementById('ui-title');
      if (titleEl) titleEl.innerText = t.title;
      
      const redEl = document.getElementById('lbl-red');
      if (redEl) redEl.innerText = t.red;
      const greenEl = document.getElementById('lbl-green');
      if (greenEl) greenEl.innerText = t.green;
      const blackEl = document.getElementById('lbl-black');
      if (blackEl) blackEl.innerText = t.black;
      
      const histEl = document.getElementById('lbl-history');
      if (histEl) histEl.innerText = t.history;
      
      const spinText = document.getElementById('spin-btn-text');
      if (spinText && !isSpinning) spinText.innerText = t.spin;

      const resultBox = document.getElementById('result-box');
      if (resultBox && !isSpinning && !resultBox.dataset.hasResult) {
        resultBox.innerText = t.prompt;
      }
    }

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'language_changed') {
        applyLang(e.data.lang);
      }
    });

    // Base segment list (17 sectors)
    const baseSegments = [
      { type: 'green', value: 0 },
      { type: 'red', value: 1 },
      { type: 'black', value: 2 },
      { type: 'red', value: 3 },
      { type: 'black', value: 4 },
      { type: 'mega_cone', value: 888 },
      { type: 'red', value: 5 },
      { type: 'black', value: 6 },
      { type: 'red', value: 7 },
      { type: 'jackpot', value: 777 },
      { type: 'black', value: 8 },
      { type: 'red', value: 9 },
      { type: 'black', value: 10 },
      { type: 'red', value: 11 },
      { type: 'black', value: 12 },
      { type: 'red', value: 13 },
      { type: 'black', value: 14 }
    ];

    const multipliers = { red: 2, black: 2, green: 14 };

    let balance = 0;
    let currentBet = null;
    let betAmount = 1000;
    let isSpinning = false;
    let stats = { wins: 0, totalBet: 0, conesWon: 0, conesLost: 0 };
    let history = [];
    let tgUserId = null;
    let soundEnabled = true;

    const ITEM_WIDTH = 76; // 68px width + 8px gap
    let reelElements = [];

    // Telegram User ID init
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        const tg = window.Telegram.WebApp;
        tg.ready();
        tgUserId = tg.initDataUnsafe?.user?.id;
      }
    } catch(e) {}

    if (!tgUserId) {
      let storedId = localStorage.getItem('rl_casino_user_id');
      if (!storedId) {
        storedId = Math.floor(Math.random() * 1000000) + 100000;
        localStorage.setItem('rl_casino_user_id', storedId);
      }
      tgUserId = parseInt(storedId);
    }

    const rouletteMusic = document.getElementById('roulette-music');

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('sound-toggle-btn');
      if (btn) btn.innerText = soundEnabled ? '🔊' : '🔇';
      if (!soundEnabled && rouletteMusic) {
        rouletteMusic.pause();
      }
    }

    // Initialize track with seamless repeating sequence
    function initReelTrack() {
      const track = document.getElementById('reel-track');
      track.innerHTML = '';
      reelElements = [];

      // Create 6 repeated cycles (total ~102 items)
      const REPEATS = 6;
      for (let r = 0; r < REPEATS; r++) {
        baseSegments.forEach((seg, idx) => {
          const el = document.createElement('div');
          el.className = `reel-item reel-item--${seg.type}`;
          el.dataset.type = seg.type;
          el.dataset.value = seg.value;

          if (seg.type === 'green') {
            el.innerHTML = '<span>0</span>';
          } else if (seg.type === 'jackpot') {
            el.innerHTML = '<span style="font-size:1.1rem;">💎</span><span style="font-size:0.65rem; font-weight:900;">x100</span>';
          } else if (seg.type === 'mega_cone') {
            el.innerHTML = '<img src="images/mega_cone.png" style="width:28px;height:28px;object-fit:contain;filter:drop-shadow(0 0 6px #38bdf8);"><span style="font-size:0.58rem;font-weight:900;color:#fff;text-shadow:0 0 4px #000;">+1 LVL</span>';
          } else {
            el.innerHTML = `<span>${seg.value}</span>`;
          }

          track.appendChild(el);
          reelElements.push({ el, seg });
        });
      }

      // Initial position to show middle of reel
      centerReelOnIndex(8, false);
    }

    function centerReelOnIndex(targetIndex, animate = true) {
      const viewport = document.getElementById('reel-viewport');
      const track = document.getElementById('reel-track');
      const viewportWidth = viewport.offsetWidth || 380;
      
      // Center position calculation:
      // targetItemCenter = targetIndex * ITEM_WIDTH + (68 / 2)
      // offset = (viewportWidth / 2) - targetItemCenter
      const itemCenter = targetIndex * ITEM_WIDTH + 34;
      const targetOffset = (viewportWidth / 2) - itemCenter;

      if (animate) {
        track.style.transition = 'transform 3.2s cubic-bezier(0.12, 0.85, 0.15, 1)';
      } else {
        track.style.transition = 'none';
      }
      track.style.transform = `translateX(${targetOffset}px)`;
      return targetOffset;
    }

    function selectBet(type) {
      if (isSpinning) return;
      currentBet = type;

      document.querySelectorAll('.bet-choice-card').forEach(c => c.classList.remove('active'));
      const card = document.getElementById(`bet-card-${type}`);
      if (card) card.classList.add('active');

      const spinBtn = document.getElementById('spin-btn');
      if (spinBtn) spinBtn.disabled = false;
    }

    function onBetInputChange() {
      const input = document.getElementById('bet-amount-input');
      let val = parseInt(input.value) || 1000;
      if (val < 1000) val = 1000;
      betAmount = val;
    }

    function adjustBet(delta) {
      if (isSpinning) return;
      betAmount = Math.max(1000, betAmount + delta);
      document.getElementById('bet-amount-input').value = betAmount;
    }

    function setBet(amount) {
      if (isSpinning) return;
      betAmount = Math.max(1000, amount);
      document.getElementById('bet-amount-input').value = betAmount;
    }

    function multiplyBet(factor) {
      if (isSpinning) return;
      if (factor === 0.5) {
        betAmount = Math.max(1000, Math.floor(betAmount / 2));
      } else {
        betAmount = Math.max(1000, betAmount * 2);
      }
      document.getElementById('bet-amount-input').value = betAmount;
    }

    function setBetMax() {
      if (isSpinning) return;
      betAmount = Math.max(1000, balance);
      document.getElementById('bet-amount-input').value = betAmount;
    }

    function showResultBanner(text, type) {
      const box = document.getElementById('result-box');
      box.innerText = text;
      box.dataset.hasResult = 'true';
      box.className = 'result-banner ' + (type === 'win' ? 'result-win' : (type === 'lose' ? 'result-lose' : ''));
    }

    function updateBalanceUI(newBalance) {
      balance = newBalance;
      document.getElementById('balance').innerText = balance.toLocaleString('ru-RU');
      window.parent.postMessage({ type: 'token_balance', balance: balance }, window.location.origin);
    }

    async function spin() {
      if (isSpinning || !currentBet) return;

      onBetInputChange();

      if (balance < 1000 || betAmount < 1000) {
        showResultBanner(t.minBet, 'lose');
        return;
      }

      if (betAmount > balance) {
        showResultBanner(t.noCones, 'lose');
        return;
      }

      isSpinning = true;
      const spinBtn = document.getElementById('spin-btn');
      const spinText = document.getElementById('spin-btn-text');
      spinBtn.disabled = true;
      if (spinText) spinText.innerText = t.spinning;

      // Clear any previous winning item highlights
      document.querySelectorAll('.reel-item').forEach(el => el.classList.remove('is-winner'));

      // Deduct bet locally
      balance -= betAmount;
      updateBalanceUI(balance);
      stats.totalBet += betAmount;

      // Music start
      if (soundEnabled && rouletteMusic) {
        rouletteMusic.volume = 0.3;
        rouletteMusic.currentTime = 0;
        rouletteMusic.play().catch(() => {});
      }

      // Fetch outcome from backend
      const result = await playRound(currentBet, betAmount);

      // Find suitable matching sector in 4th repeat block (around index 50-70)
      const repeatTargetCycle = 3;
      const targetBaseIndex = baseSegments.findIndex(s => s.value === result.number);
      const targetIndex = repeatTargetCycle * baseSegments.length + targetBaseIndex;

      // Animate horizontal roll
      centerReelOnIndex(targetIndex, true);

      // Result reveal after animation (3.2 seconds)
      setTimeout(() => {
        if (rouletteMusic) {
          rouletteMusic.pause();
          rouletteMusic.currentTime = 0;
        }

        // Highlight winning card on reel
        if (reelElements[targetIndex]) {
          reelElements[targetIndex].el.classList.add('is-winner');
        }

        if (result.isMegaCone) {
          stats.wins++;
          showResultBanner(t.megaConeWin, 'win');
          addToHistory(result.number, result.type, true);
          balance += betAmount;
          updateBalanceUI(balance);
          try {
            window.parent.postMessage({ type: 'inventory_updated' }, window.location.origin);
          } catch(e) {}
        } else if (result.win) {
          stats.wins++;
          stats.conesWon += result.winAmount;
          if (result.isJackpot) {
            showResultBanner(`${t.jackpotText}${result.winAmount.toLocaleString('ru-RU')} 🌰`, 'win');
          } else {
            showResultBanner(`${t.winText}${result.winAmount.toLocaleString('ru-RU')} 🌰`, 'win');
          }
          addToHistory(result.number, result.type, true);
          balance += result.winAmount;
          updateBalanceUI(balance);
        } else {
          stats.conesLost += betAmount;
          showResultBanner(`${t.loseText}${betAmount.toLocaleString('ru-RU')} 🌰`, 'lose');
          addToHistory(result.number, result.type, false);
        }

        const winRate = document.getElementById('stats-win-rate');
        if (winRate) winRate.innerText = `${t.wins}${stats.wins}`;

        isSpinning = false;
        spinBtn.disabled = false;
        if (spinText) spinText.innerText = t.spin;
      }, 3300);
    }

    async function playRound(betType, amount) {
      try {
        const res = await fetch('/api/casino/roulette', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Telegram-Init-Data': window.parent.Telegram?.WebApp?.initData || window.Telegram?.WebApp?.initData || ''
          },
          body: JSON.stringify({ userId: tgUserId, betType: betType, betAmount: amount })
        });
        const data = await res.json();
        if (data.status === 'ok') {
          return {
            number: data.result.number,
            type: data.result.type,
            win: data.win,
            winAmount: data.winAmount || 0,
            isJackpot: data.isJackpot || false,
            isMegaCone: data.isMegaCone || false,
            itemWon: data.itemWon || null
          };
        }
      } catch(e) {
        console.error('Ошибка игры:', e);
      }
      return generateLocalResult(betType, amount);
    }

    function generateLocalResult(betType, amount) {
      const normalSegments = baseSegments.filter(s => s.type !== 'jackpot' && s.type !== 'mega_cone');
      const randIndex = Math.floor(Math.random() * normalSegments.length);
      let segment = normalSegments[randIndex];

      let win = false;
      let isJackpot = false;
      let isMegaCone = false;

      const rand = Math.random();
      if (rand < 0.001) {
        isJackpot = true;
        win = true;
        segment = baseSegments.find(s => s.type === 'jackpot');
      } else if (rand < 0.016) {
        isMegaCone = true;
        win = true;
        segment = baseSegments.find(s => s.type === 'mega_cone');
      } else {
        if (betType === 'red' && segment.type === 'red') win = true;
        else if (betType === 'black' && segment.type === 'black') win = true;
        else if (betType === 'green' && segment.type === 'green') win = true;
      }

      return {
        number: segment.value,
        type: segment.type,
        win: win,
        winAmount: win ? (isJackpot ? amount * 100 : (isMegaCone ? amount : Math.floor(amount * multipliers[betType]))) : 0,
        isJackpot: isJackpot,
        isMegaCone: isMegaCone
      };
    }

    function addToHistory(number, type, win) {
      history.unshift({ number, type, win });
      if (history.length > 8) history.pop();

      const list = document.getElementById('history-list');
      list.innerHTML = '';
      history.forEach(item => {
        const el = document.createElement('div');
        el.className = `hist-pill hist-pill--${item.type}`;
        if (item.type === 'jackpot') el.innerText = '💎';
        else if (item.type === 'mega_cone') el.innerHTML = '<img src="images/mega_cone.png" style="width:18px;height:18px;object-fit:contain;">';
        else el.innerText = item.number;
        
        if (item.win) {
          el.style.boxShadow = '0 0 8px #00ff88';
        }
        list.appendChild(el);
      });
    }

    async function loadBalance() {
      try {
        const res = await fetch(`/api/tokens?userId=${tgUserId}`);
        const data = await res.json();
        if (data.status === 'ok' && data.tokens) {
          balance = data.tokens.balance;
          document.getElementById('balance').innerText = balance.toLocaleString('ru-RU');
        }
      } catch(e) {}
    }

    window.addEventListener('DOMContentLoaded', () => {
      applyLang(lang);
      initReelTrack();
      loadBalance();
    });

    window.addEventListener('message', function(event) {
      if (event.origin !== window.location.origin) return;
      if (!event.data) return;

      if (event.data.type === 'init_game') {
        const initBalance = event.data.balance || 0;
        if (event.data.userId) tgUserId = event.data.userId;
        updateBalanceUI(initBalance);
        loadBalance();
      }
    });

    // Handle resize
    window.addEventListener('resize', () => {
      centerReelOnIndex(8, false);
    });
  </script>
</body>
</html>
