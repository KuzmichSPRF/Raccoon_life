<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Башня 3.0: Путь Енота</title>
  <script src="https://telegram.org/js/telegram-web-app.js" async></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #E53935;
      --accent: #FF3B30;
      --bg-color: #121214;
      --card-bg: #18181A;
      --card-elevated: #222224;
      --text-main: #FFFFFF;
      --text-sec: rgba(255, 255, 255, 0.65);
      --game-green: #33BD1C;
      --game-yellow: #FFD700;
      --boss-color: #9b59b6;
      --border-subtle: 1px solid rgba(255, 255, 255, 0.08);
      --border-glow: 1px solid rgba(229, 57, 53, 0.4);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      background-color: var(--bg-color);
      margin: 0;
      padding: 12px 14px 24px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .level-badge {
      background: linear-gradient(180deg, #FF3B30 0%, #E53935 100%);
      padding: 6px 14px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 0.85rem;
      box-shadow: 0 4px 12px rgba(229, 57, 53, 0.4);
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .sound-btn {
      background: var(--card-elevated);
      border: var(--border-subtle);
      color: #fff;
      border-radius: 10px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .sound-btn:active { transform: scale(0.9); }

    /* Status Box */
    .status-box {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: var(--text-main);
      border: var(--border-subtle);
      font-size: 0.95rem;
    }

    /* Arena */
    .arena {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: radial-gradient(circle at center, rgba(229,57,53,0.08) 0%, rgba(18,18,20,0) 70%), var(--card-bg);
      border-radius: 20px;
      border: var(--border-subtle);
      padding: 14px 8px 18px;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .fighter-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 130px;
    }
    .chip-frame {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      position: relative;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
      padding: 2px;
      background: #18181a;
      border: 2px solid rgba(255,255,255,0.15);
    }
    .chip-frame.player-chip {
      border-color: #00e5ff;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.35);
    }
    .chip-frame.enemy-chip {
      border-color: #ff9100;
      box-shadow: 0 0 20px rgba(255, 145, 0, 0.35);
    }
    .chip-frame.boss-chip {
      border-color: #a855f7;
      box-shadow: 0 0 22px rgba(168, 85, 247, 0.5);
      animation: pulseBoss 2s infinite;
    }
    @keyframes pulseBoss {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .chip-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }
    .enemy-icon-overlay {
      position: absolute;
      bottom: -4px;
      right: -4px;
      background: #18181a;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }
    .fighter-title {
      font-size: 0.8rem;
      font-weight: 800;
      margin-top: 6px;
      margin-bottom: 2px;
      color: #fff;
    }

    /* Bars */
    .bars {
      width: 100%;
      margin-top: 4px;
    }
    .bar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-sec);
      margin-bottom: 2px;
    }
    .bar-track {
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .bar-fill {
      height: 100%;
      transition: width 0.35s ease;
    }
    .bar-fill.hp {
      background: linear-gradient(90deg, #33BD1C, #64dd17);
    }
    .bar-fill.energy {
      background: linear-gradient(90deg, #ff9100, #FFD700);
    }

    /* Combat Animations */
    .animate-attack {
      animation: playerStrike 0.35s ease-in-out;
    }
    .animate-enemy-attack {
      animation: enemyStrike 0.35s ease-in-out;
    }
    @keyframes playerStrike {
      0% { transform: scale(1) translateX(0); }
      50% { transform: scale(1.15) translateX(30px) rotate(8deg); }
      100% { transform: scale(1) translateX(0); }
    }
    @keyframes enemyStrike {
      0% { transform: scale(1) translateX(0); }
      50% { transform: scale(1.15) translateX(-30px) rotate(-8deg); }
      100% { transform: scale(1) translateX(0); }
    }
    .crit {
      animation: critShake 0.35s ease-in-out !important;
      border-color: #ffd700 !important;
      box-shadow: 0 0 25px #ffd700 !important;
    }
    @keyframes critShake {
      0%, 100% { transform: rotate(0); }
      20% { transform: rotate(12deg) scale(1.1); }
      40% { transform: rotate(-12deg) scale(1.1); }
      60% { transform: rotate(8deg); }
      80% { transform: rotate(-8deg); }
    }
    .heal-effect {
      border-color: #33bd1c !important;
      box-shadow: 0 0 25px #33bd1c !important;
      animation: healPulse 0.4s ease-in-out;
    }
    @keyframes healPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); filter: brightness(1.3); }
    }

    /* Controls */
    .controls-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 14px;
      border: var(--border-subtle);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-action {
      background: var(--card-elevated);
      border: var(--border-subtle);
      border-radius: 14px;
      padding: 12px 10px;
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
      min-height: 54px;
    }
    .btn-action:active { transform: scale(0.96); }
    .btn-action:disabled {
      opacity: 0.35;
      background: #19191c !important;
      border-color: transparent !important;
      cursor: not-allowed;
    }
    .btn-main-strike {
      grid-column: span 2;
      background: linear-gradient(180deg, #FF3B30 0%, #E53935 100%);
      box-shadow: 0 4px 16px rgba(229, 57, 53, 0.4);
      font-size: 0.92rem;
      font-weight: 800;
      padding: 14px;
      border: none;
      flex-direction: row;
      gap: 8px;
    }
    .btn-sp1 {
      border: 1px solid rgba(255, 145, 0, 0.35);
      background: linear-gradient(180deg, #2a221b 0%, #1e1915 100%);
    }
    .btn-sp2 {
      border: 1px solid rgba(51, 189, 28, 0.35);
      background: linear-gradient(180deg, #19271a 0%, #131d14 100%);
    }
    .btn-sp3 {
      grid-column: span 2;
      border: 1px solid rgba(168, 85, 247, 0.4);
      background: linear-gradient(180deg, #2d1838 0%, #1f1127 100%);
    }
    .cost-pill {
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      font-weight: 700;
      color: var(--game-yellow);
    }
    .btn-cookie-row {
      grid-column: span 2;
      background: rgba(255, 255, 255, 0.04);
      border: var(--border-subtle);
      border-radius: 12px;
      padding: 10px;
      color: #fff;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-next-level {
      grid-column: span 2;
      background: linear-gradient(180deg, #33BD1C 0%, #2e7d32 100%);
      box-shadow: 0 4px 16px rgba(51, 189, 28, 0.45);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-weight: 900;
      font-size: 0.95rem;
      cursor: pointer;
      display: none;
      text-transform: uppercase;
      font-family: inherit;
    }

    .cone-icon {
      width: 1.15em;
      height: 1.15em;
      vertical-align: -0.15em;
      object-fit: contain;
      filter: drop-shadow(0 0 4px rgba(255, 180, 0, 0.6));
    }
    .log-box {
      font-size: 0.72rem;
      color: var(--text-sec);
      margin-top: 10px;
      min-height: 16px;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="level-badge" id="lvl-display">🏰 LVL 1</div>
    <button class="sound-btn" id="snd-toggle" onclick="toggleAudio()" title="Звук">🔊</button>
  </div>

  <!-- Status Box -->
  <div class="status-box" id="msg">Новый противник!</div>

  <!-- Arena -->
  <div class="arena">
    <div class="fighter-wrapper" id="player-area">
      <div id="p-cap" class="chip-frame player-chip">
        <img src="chip_raccoon.png" alt="Raccoon Hero" class="chip-img" onerror="this.src='cone.png'">
      </div>
      <div class="fighter-title" id="p-name">Вы (Енот)</div>
      <div class="bars">
        <div class="bar-row">
          <span>HP</span>
          <span id="p-hp-text">100</span>
        </div>
        <div class="bar-track">
          <div id="p-hp" class="bar-fill hp" style="width: 100%;"></div>
        </div>
        <div class="bar-row">
          <span>Энергия</span>
          <span id="p-nrg-text">0</span>
        </div>
        <div class="bar-track">
          <div id="p-nrg" class="bar-fill energy" style="width: 0%;"></div>
        </div>
      </div>
    </div>

    <div style="font-weight: 900; font-size: 1.1rem; color: rgba(255,255,255,0.25);">VS</div>

    <div class="fighter-wrapper" id="enemy-area">
      <div id="e-cap" class="chip-frame enemy-chip">
        <img src="chip_enemy.png" id="e-img" alt="Enemy" class="chip-img" onerror="this.src='cone.png'">
        <div class="enemy-icon-overlay" id="e-icon">⚪</div>
      </div>
      <div class="fighter-title" id="e-name">Враг</div>
      <div class="bars">
        <div class="bar-row">
          <span>HP</span>
          <span id="e-hp-text">100</span>
        </div>
        <div class="bar-track">
          <div id="e-hp" class="bar-fill hp" style="width: 100%;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls-card">
    <button class="btn-action btn-main-strike" id="btn-atk" onclick="playerTurn('attack')">
      <span>🥊 Удар</span>
      <span class="cost-pill">+20 NRG</span>
    </button>
    <button class="btn-action btn-sp1" id="btn-sp1" onclick="playerTurn('trash')" disabled>
      <span>🗑️ Мусор</span>
      <span class="cost-pill">40 NRG</span>
    </button>
    <button class="btn-action btn-sp2" id="btn-sp2" onclick="playerTurn('snack')" disabled>
      <span>🥨 Снэк (Лечение)</span>
      <span class="cost-pill">30 NRG</span>
    </button>
    <button class="btn-action btn-sp3" id="btn-sp3" onclick="playerTurn('rage')" disabled>
      <span>🔥 Ярость Енота (УЛЬТА)</span>
      <span class="cost-pill">80 NRG</span>
    </button>
    <button class="btn-cookie-row" id="btn-cookie" onclick="buyCookie()">
      <span>🍪 Восстановить 100% HP (100 <img src="cone.png" class="cone-icon" alt="🌰">)</span>
    </button>
    <button class="btn-next-level" id="btn-next" onclick="nextLevel()">СЛЕДУЮЩИЙ УРОВЕНЬ ➜</button>
  </div>
  
  <div class="log-box" id="log">...</div>

  <script>
    let level = 1;
    let pStats = { hp: 100, maxHp: 100, nrg: 0 };
    let eStats = { hp: 100, maxHp: 100, dmg: 10 };
    let turn = true;
    let soundMuted = localStorage.getItem('rl_sound_muted') === 'true';

    // Sound Synthesizer
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioCtx = new AudioCtx();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSfx(type) {
      if (soundMuted) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'hit') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(50, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'crit') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(650, now + 0.1);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'heal') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.exponentialRampToValueAtTime(520, now + 0.2);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'win') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.setValueAtTime(450, now + 0.1);
          osc.frequency.setValueAtTime(600, now + 0.2);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          osc.start(now);
          osc.stop(now + 0.4);
        } else if (type === 'tap') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        }
      } catch (e) {}
    }

    function triggerHaptic(type) {
      try {
        if (window.Telegram?.WebApp?.HapticFeedback) {
          if (type === 'heavy') window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
          else if (type === 'success') window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
          else if (type === 'error') window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
          else window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
        } else if (navigator.vibrate) {
          navigator.vibrate(type === 'heavy' ? 40 : 15);
        }
      } catch (e) {}
    }

    function toggleAudio() {
      soundMuted = !soundMuted;
      localStorage.setItem('rl_sound_muted', soundMuted);
      const btn = document.getElementById('snd-toggle');
      if (btn) btn.innerText = soundMuted ? '🔇' : '🔊';
      if (!soundMuted) playSfx('tap');
    }
    const sndBtn = document.getElementById('snd-toggle');
    if (sndBtn) sndBtn.innerText = soundMuted ? '🔇' : '🔊';

    let lang = localStorage.getItem('rl_lang') || 'ru';
    const translations = {
      ru: {
        title: "Башня 3.0", msgSt: "Новый противник!", enL: "Энергия",
        btnA: "🥊 Удар", btnS1: "🗑️ Мусор", btnS2: "🥨 Снэк", btnS3: "🔥 Ярость Енота (УЛЬТА)", btnC: '🍪 100% HP (100 <img src="cone.png" class="cone-icon" alt="🌰">)',
        btnN: "СЛЕДУЮЩИЙ УРОВЕНЬ ➜", enemy: "Враг"
      },
      en: {
        title: "Tower 3.0", msgSt: "New Enemy!", enL: "Energy",
        btnA: "🥊 Strike", btnS1: "🗑️ Trash", btnS2: "🥨 Snack", btnS3: "🔥 Raccoon Rage (ULT)", btnC: '🍪 100% HP (100 <img src="cone.png" class="cone-icon" alt="🌰">)',
        btnN: "NEXT LEVEL ➜", enemy: "Enemy"
      }
    };
    let t = translations[lang] || translations.ru;

    let ENEMIES = [];
    let BOSS = {};

    function updateEnemiesList() {
      ENEMIES = lang === 'ru' ? [
        { name: "Кэпс Новичок", icon: "⚪", hp: 80, dmg: 8, img: "chip_enemy.png", glow: "#ff9100", border: "#ff9100", filter: "none" },
        { name: "Ржавая Бита", icon: "🟤", hp: 90, dmg: 9, img: "chip_enemy.png", glow: "#d97706", border: "#b45309", filter: "sepia(0.6) hue-rotate(330deg)" },
        { name: "Смайлик", icon: "🙂", hp: 100, dmg: 10, img: "chip_enemy.png", glow: "#eab308", border: "#facc15", filter: "hue-rotate(45deg) saturate(1.4)" },
        { name: "Инь-Янь", icon: "☯️", hp: 110, dmg: 11, img: "chip_ninja.png", glow: "#e2e8f0", border: "#94a3b8", filter: "grayscale(1) contrast(1.4)" },
        { name: "Череп", icon: "💀", hp: 120, dmg: 12, img: "chip_boss.png", glow: "#f43f5e", border: "#e11d48", filter: "hue-rotate(290deg) contrast(1.2)" },
        { name: "Шар №8", icon: "🎱", hp: 130, dmg: 13, img: "chip_vladeos.png", glow: "#38bdf8", border: "#0284c7", filter: "hue-rotate(220deg) brightness(0.9)" },
        { name: "Ядовитый", icon: "🤢", hp: 115, dmg: 14, img: "chip_enemy.png", glow: "#22c55e", border: "#16a34a", filter: "hue-rotate(90deg) saturate(1.8)" },
        { name: "Пришелец", icon: "👽", hp: 125, dmg: 12, img: "chip_robot.png", glow: "#10b981", border: "#059669", filter: "hue-rotate(140deg) saturate(1.6)" },
        { name: "Ниндзя", icon: "🥷", hp: 100, dmg: 16, img: "chip_ninja.png", glow: "#a855f7", border: "#9333ea", filter: "none" },
        { name: "Робот", icon: "🤖", hp: 140, dmg: 10, img: "chip_robot.png", glow: "#00e5ff", border: "#06b6d4", filter: "none" },
        { name: "Вампир", icon: "🧛", hp: 110, dmg: 15, img: "chip_vladeos.png", glow: "#e11d48", border: "#be123c", filter: "hue-rotate(320deg) saturate(1.6)" },
        { name: "Зомби", icon: "🧟", hp: 150, dmg: 8, img: "chip_boss.png", glow: "#84cc16", border: "#65a30d", filter: "hue-rotate(100deg) saturate(1.3)" },
        { name: "Дракон", icon: "🐉", hp: 160, dmg: 14, img: "chip_dragon.png", glow: "#ff4500", border: "#f97316", filter: "none" },
        { name: "Волшебник", icon: "🧙", hp: 90, dmg: 18, img: "chip_vladeos.png", glow: "#c084fc", border: "#a855f7", filter: "hue-rotate(260deg) saturate(1.4)" },
        { name: "Алмазный", icon: "💎", hp: 180, dmg: 10, img: "chip_robot.png", glow: "#38bdf8", border: "#67e8f9", filter: "hue-rotate(180deg) brightness(1.3)" }
      ] : [
        { name: "Caps Noob", icon: "⚪", hp: 80, dmg: 8, img: "chip_enemy.png", glow: "#ff9100", border: "#ff9100", filter: "none" },
        { name: "Rusty Bat", icon: "🟤", hp: 90, dmg: 9, img: "chip_enemy.png", glow: "#d97706", border: "#b45309", filter: "sepia(0.6) hue-rotate(330deg)" },
        { name: "Smiley", icon: "🙂", hp: 100, dmg: 10, img: "chip_enemy.png", glow: "#eab308", border: "#facc15", filter: "hue-rotate(45deg) saturate(1.4)" },
        { name: "Yin-Yang", icon: "☯️", hp: 110, dmg: 11, img: "chip_ninja.png", glow: "#e2e8f0", border: "#94a3b8", filter: "grayscale(1) contrast(1.4)" },
        { name: "Skull", icon: "💀", hp: 120, dmg: 12, img: "chip_boss.png", glow: "#f43f5e", border: "#e11d48", filter: "hue-rotate(290deg) contrast(1.2)" },
        { name: "8-Ball", icon: "🎱", hp: 130, dmg: 13, img: "chip_vladeos.png", glow: "#38bdf8", border: "#0284c7", filter: "hue-rotate(220deg) brightness(0.9)" },
        { name: "Toxic", icon: "🤢", hp: 115, dmg: 14, img: "chip_enemy.png", glow: "#22c55e", border: "#16a34a", filter: "hue-rotate(90deg) saturate(1.8)" },
        { name: "Alien", icon: "👽", hp: 125, dmg: 12, img: "chip_robot.png", glow: "#10b981", border: "#059669", filter: "hue-rotate(140deg) saturate(1.6)" },
        { name: "Ninja", icon: "🥷", hp: 100, dmg: 16, img: "chip_ninja.png", glow: "#a855f7", border: "#9333ea", filter: "none" },
        { name: "Robot", icon: "🤖", hp: 140, dmg: 10, img: "chip_robot.png", glow: "#00e5ff", border: "#06b6d4", filter: "none" },
        { name: "Vampire", icon: "🧛", hp: 110, dmg: 15, img: "chip_vladeos.png", glow: "#e11d48", border: "#be123c", filter: "hue-rotate(320deg) saturate(1.6)" },
        { name: "Zombie", icon: "🧟", hp: 150, dmg: 8, img: "chip_boss.png", glow: "#84cc16", border: "#65a30d", filter: "hue-rotate(100deg) saturate(1.3)" },
        { name: "Dragon", icon: "🐉", hp: 160, dmg: 14, img: "chip_dragon.png", glow: "#ff4500", border: "#f97316", filter: "none" },
        { name: "Wizard", icon: "🧙", hp: 90, dmg: 18, img: "chip_vladeos.png", glow: "#c084fc", border: "#a855f7", filter: "hue-rotate(260deg) saturate(1.4)" },
        { name: "Diamond", icon: "💎", hp: 180, dmg: 10, img: "chip_robot.png", glow: "#38bdf8", border: "#67e8f9", filter: "hue-rotate(180deg) brightness(1.3)" }
      ];
      BOSS = lang === 'ru' ? { name: "КОТОПЕТУХ", icon: "🐱🐔", hp: 300, dmg: 18, img: "chip_boss_catrooster.png", glow: "#ffd700", border: "#ff9100", filter: "none" } : { name: "CATROOSTER", icon: "🐱🐔", hp: 300, dmg: 18, img: "chip_boss_catrooster.png", glow: "#ffd700", border: "#ff9100", filter: "none" };
    }

    function applyLang(selectedLang) {
      lang = selectedLang || 'ru';
      t = translations[lang] || translations.ru;
      updateEnemiesList();
      const msgEl = document.getElementById('msg');
      if (msgEl) msgEl.innerText = t.msgSt;
      const cookieBtn = document.getElementById('btn-cookie');
      if (cookieBtn) cookieBtn.innerHTML = `<span>${t.btnC}</span>`;
      const btnNext = document.getElementById('btn-next');
      if (btnNext) btnNext.innerText = t.btnN;
    }

    applyLang(lang);

    function getUserId() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const u = urlParams.get('userId');
        if (u && !isNaN(parseInt(u, 10)) && parseInt(u, 10) > 0) return parseInt(u, 10);
      } catch (e) {}

      try {
        let id = localStorage.getItem('rl_user_id');
        if (id && id !== 'undefined' && id !== 'null') {
          const parsed = parseInt(id, 10);
          if (!isNaN(parsed) && parsed > 0) return parsed;
        }
      } catch (e) {}

      try {
        if (window.parent && window.parent.getUserId) {
          const pid = window.parent.getUserId();
          if (pid && !isNaN(parseInt(pid, 10)) && parseInt(pid, 10) > 0) return parseInt(pid, 10);
        }
      } catch (e) {}

      try {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe?.user?.id) {
          return window.Telegram.WebApp.initDataUnsafe.user.id;
        }
      } catch (e) {}

      try {
        let storedId = localStorage.getItem('rl_temp_user_id');
        if (!storedId) {
          storedId = String(Math.floor(Math.random() * 1000000) + 100000);
          localStorage.setItem('rl_temp_user_id', storedId);
        }
        return parseInt(storedId, 10);
      } catch (e) {
        return 999999;
      }
    }

    function getInitData() {
      try {
        if (window.parent && window.parent.Telegram && window.parent.Telegram.WebApp && window.parent.Telegram.WebApp.initData) {
          return window.parent.Telegram.WebApp.initData;
        }
      } catch (e) {}
      try {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
          return window.Telegram.WebApp.initData;
        }
      } catch (e) {}
      return '';
    }

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.type === 'init_game') {
        if (e.data.userId) {
          localStorage.setItem('rl_user_id', e.data.userId);
        }
        if (e.data.lang) {
          applyLang(e.data.lang);
        }
        initGame();
      } else if (e.data.type === 'language_changed') {
        applyLang(e.data.lang);
      }
    });

    async function apiCall(actionType) {
        let userId = getUserId();
        if (!userId) userId = 999999;
        try {
            const headers = { 'Content-Type': 'application/json' };
            const initData = getInitData();
            if (initData) headers['X-Telegram-Init-Data'] = initData;

            const res = await fetch('/api/game/tower', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ 
                    userId: userId, 
                    action: actionType, 
                    level: level,
                    currentEnergy: pStats.nrg,
                    currentHP: pStats.hp
                })
            });
            return await res.json();
        } catch(e) { return null; }
    }

    function initGame() {
      level = 1;
      startLevel();
    }

    async function startLevel() {
      document.getElementById('lvl-display').innerText = "🏰 LVL " + level;
      document.getElementById('btn-next').style.display = 'none';
      toggleButtons(false);

      let enemyTemplate;
      let isBoss = (level % 10 === 0);
      const enemyCap = document.getElementById('e-cap');
      const enemyImg = document.getElementById('e-img');

      if (isBoss) {
        enemyTemplate = BOSS;
        enemyCap.classList.add('boss-chip');
      } else {
        enemyTemplate = ENEMIES[Math.floor(Math.random() * ENEMIES.length)];
        enemyCap.classList.remove('boss-chip');
      }

      enemyImg.src = enemyTemplate.img || 'chip_enemy.png';
      enemyImg.style.filter = enemyTemplate.filter || 'none';
      enemyCap.style.borderColor = enemyTemplate.border || '#ff9100';
      enemyCap.style.boxShadow = `0 0 20px ${enemyTemplate.glow || 'rgba(255,145,0,0.4)'}`;

      const data = await apiCall('start');
      if (data && data.status === 'ok') {
          eStats.maxHp = data.state.eMaxHP;
          eStats.hp = data.state.eHP;
          eStats.dmg = data.state.eDmg;
          pStats.hp = data.state.pHP;
          pStats.nrg = data.state.pNRG;
      } else if (data && data.error === 'Too Many Requests') {
          document.getElementById('msg').innerText = lang === 'ru' ? "Слишком быстро! Подождите..." : "Too fast! Wait...";
          document.getElementById('msg').style.color = "var(--accent)";
          return;
      }

      document.getElementById('e-name').innerText = enemyTemplate.name;
      document.getElementById('e-icon').innerText = enemyTemplate.icon;
      document.getElementById('msg').innerText = isBoss ? (lang === 'ru' ? "БОСС: КОТОПЕТУХ!" : "BOSS: CATROOSTER!") : (lang === 'ru' ? "Враг: " : "Enemy: ") + enemyTemplate.name;
      document.getElementById('msg').style.color = 'var(--text-main)';

      turn = true;
      updateUI();
    }

    async function playerTurn(actionType) {
      if (!turn) return;
      turn = false;
      playSfx('tap');
      triggerHaptic('medium');
      toggleButtons(true);
      
      const data = await apiCall(actionType);
      if (!data || data.status !== 'ok') {
          if (data && data.error === 'No active session') {
              await apiCall('start');
          } else if (data && data.error === 'Too Many Requests') {
              document.getElementById('msg').innerText = lang === 'ru' ? "Слишком быстро! Подождите..." : "Too fast! Wait...";
              document.getElementById('msg').style.color = "var(--accent)";
          }
          toggleButtons(false); turn = true; return;
      }
      
      let txt = actionType === 'attack' ? (lang === 'ru' ? "Удар лапой!" : "Paw attack!") :
                actionType === 'trash' ? (lang === 'ru' ? "Мусорный залп!" : "Trash volley!") :
                actionType === 'snack' ? (lang === 'ru' ? "Вкусный снэк!" : "Tasty snack!") : (lang === 'ru' ? "ЯРОСТЬ ЕНОТА!" : "RACCOON RAGE!");
      if (data.player_log.is_crit) txt += (lang === 'ru' ? " (КРИТ!)" : " (CRIT!)");

      pStats.nrg = data.player_log.pNRG;
      pStats.hp = data.player_log.pHP;
      eStats.hp = data.player_log.eHP;

      animateAction('p-cap', data.player_log.dmg, data.player_log.heal, data.player_log.is_crit);
      document.getElementById('log').innerText = `${lang === 'ru' ? 'Вы' : 'You'}: ${txt}`;
      updateUI();

      if (data.game_over && data.win) {
          if (data.state) {
              pStats.hp = data.state.pHP;
              pStats.nrg = data.state.pNRG;
          }
          setTimeout(winLevel, 900);
          return;
      }

      setTimeout(() => {
          let bTxt = lang === 'ru' ? `Враг атакует на ${data.bot_log.dmg} урона!` : `Enemy attacks for ${data.bot_log.dmg} damage!`;
          pStats.nrg = data.bot_log.pNRG;
          pStats.hp = data.bot_log.pHP;
          eStats.hp = data.bot_log.eHP;

          animateAction('e-cap', data.bot_log.dmg, 0, data.bot_log.is_crit);
          document.getElementById('log').innerText = bTxt;
          updateUI();

          if (data.game_over && !data.win) {
              triggerHaptic('error');
              document.getElementById('msg').innerText = lang === 'ru' ? "ВЫ ПРОИГРАЛИ!" : "YOU LOST!";
              document.getElementById('msg').style.color = "var(--accent)";
              setTimeout(() => location.reload(), 2000);
          } else {
              turn = true;
              toggleButtons(false);
          }
      }, 1200);
    }

    function winLevel() {
      playSfx('win');
      triggerHaptic('success');
      document.getElementById('msg').innerText = lang === 'ru' ? "ПОБЕДА! (+30 HP)" : "VICTORY! (+30 HP)";
      document.getElementById('msg').style.color = "var(--game-green)";
      updateUI();
      document.getElementById('btn-next').style.display = 'block';
      toggleButtons(true);
    }

    function nextLevel() {
      playSfx('tap');
      level++;
      window.parent.postMessage({ type: 'tower_update', level: level, passed_level: true }, '*');
      document.getElementById('msg').style.color = "var(--text-main)";
      startLevel();
    }

    function animateAction(id, dmg, heal, crit) {
      const el = document.getElementById(id);
      if (dmg > 0) {
        el.classList.add(id === 'p-cap' ? 'animate-attack' : 'animate-enemy-attack');
        if (crit) {
          el.classList.add('crit');
          playSfx('crit');
          triggerHaptic('heavy');
        } else {
          playSfx('hit');
        }
      }
      if (heal > 0) {
        el.classList.add('heal-effect');
        playSfx('heal');
      }
      setTimeout(() => el.classList.remove('animate-attack', 'animate-enemy-attack', 'crit', 'heal-effect'), 380);
    }

    function buyCookie() {
      let userId = getUserId();
      if (!userId) {
        document.getElementById('log').innerText = lang === 'ru' ? "❌ Ошибка: нет user_id" : "❌ Error: no user_id";
        return;
      }

      const cookieBtn = document.getElementById('btn-cookie');
      cookieBtn.disabled = true;
      document.getElementById('log').innerText = lang === 'ru' ? "🍪 Покупка печеньки..." : "🍪 Buying cookie...";

      apiCall('cookie')
      .then(result => {
        if (result.status === 'ok') {
          if (result.tokens && result.tokens.balance !== undefined) {
            window.parent.postMessage({ type: 'token_balance', balance: result.tokens.balance }, '*');
          }

          pStats.hp = result.state.pHP || 100;
          pStats.nrg = result.state.pNRG || pStats.nrg;
          updateUI();
          playSfx('heal');
          triggerHaptic('success');
          document.getElementById('log').innerText = lang === 'ru' ? "🍪 100% HP восстановлено!" : "🍪 100% HP restored!";

          const cap = document.getElementById('p-cap');
          cap.classList.add('heal-effect');
          setTimeout(() => cap.classList.remove('heal-effect'), 400);
        } else {
          const errorMsg = result.error || 'Ошибка сервера';
          document.getElementById('log').innerText = "❌ " + errorMsg;
          triggerHaptic('error');
        }
      })
      .catch(err => {
        document.getElementById('log').innerText = lang === 'ru' ? "❌ Ошибка сети!" : "❌ Network error!";
      })
      .finally(() => {
        setTimeout(() => {
          cookieBtn.disabled = false;
        }, 500);
      });
    }

    function updateUI() {
      document.getElementById('p-hp').style.width = Math.max(0, (pStats.hp / pStats.maxHp) * 100) + "%";
      document.getElementById('p-hp-text').innerText = Math.max(0, pStats.hp);
      document.getElementById('p-nrg').style.width = pStats.nrg + "%";
      document.getElementById('p-nrg-text').innerText = pStats.nrg + "%";
      
      document.getElementById('e-hp').style.width = Math.max(0, (eStats.hp / eStats.maxHp) * 100) + "%";
      document.getElementById('e-hp-text').innerText = Math.max(0, eStats.hp);

      document.getElementById('btn-sp1').disabled = (pStats.nrg < 40);
      document.getElementById('btn-sp2').disabled = (pStats.nrg < 30);
      document.getElementById('btn-sp3').disabled = (pStats.nrg < 80);
    }

    function toggleButtons(disabled) {
      ['btn-atk', 'btn-sp1', 'btn-sp2', 'btn-sp3'].forEach(id => {
        const b = document.getElementById(id);
        if (b) b.disabled = disabled;
      });
      const cookieBtn = document.getElementById('btn-cookie');
      if (cookieBtn) cookieBtn.disabled = false;
      if (!disabled) updateUI();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGame);
    } else {
      initGame();
    }
  </script>
</body>
</html>
