<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lidMetal" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="64" cy="64" r="58" fill="url(#shieldGlow)"/>

  <!-- Outer Shield Ring -->
  <circle cx="64" cy="64" r="48" fill="url(#lidMetal)" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="42" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="32" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <!-- Metal Ridges (Trash Can Lid Style) -->
  <line x1="64" y1="22" x2="64" y2="34" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="94" x2="64" y2="106" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <line x1="22" y1="64" x2="34" y2="64" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <line x1="94" y1="64" x2="106" y2="64" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- Diagonal Ridges -->
  <line x1="34" y1="34" x2="43" y2="43" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="94" y1="94" x2="85" y2="85" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="34" y1="94" x2="43" y2="85" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="94" y1="34" x2="85" y2="43" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center Metallic Handle -->
  <rect x="52" y="56" width="24" height="16" rx="6" fill="url(#handleGrad)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="57" y="61" width="14" height="6" rx="3" fill="#0f172a"/>

  <!-- Rivets / Bolts -->
  <circle cx="64" cy="20" r="2.5" fill="#f8fafc"/>
  <circle cx="64" cy="108" r="2.5" fill="#f8fafc"/>
  <circle cx="20" cy="64" r="2.5" fill="#f8fafc"/>
  <circle cx="108" cy="64" r="2.5" fill="#f8fafc"/>

  <!-- Sparkles -->
  <path d="M98 26 L100 32 L106 34 L100 36 L98 42 L96 36 L90 34 L96 32 Z" fill="#38bdf8" filter="url(#glow)"/>
</svg>
