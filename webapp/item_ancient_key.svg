<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="keyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="keyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <radialGradient id="amethystGem" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="40%" stop-color="#c084fc"/>
      <stop offset="80%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="64" cy="64" r="58" fill="url(#keyGlow)"/>

  <!-- Key Handle (Ornate Crown / Raccoon ears silhouette) -->
  <path d="M44 32 C36 18, 52 14, 64 24 C76 14, 92 18, 84 32 C96 46, 82 58, 64 54 C46 58, 32 46, 44 32 Z" fill="url(#keyGold)" stroke="#fef08a" stroke-width="2" filter="url(#glow)"/>

  <!-- Inner Handle Cutout -->
  <circle cx="64" cy="36" r="11" fill="url(#amethystGem)" stroke="#fef08a" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Key Shaft -->
  <rect x="60" y="52" width="8" height="54" rx="3" fill="url(#keyGold)" stroke="#ca8a04" stroke-width="1" filter="url(#glow)"/>

  <!-- Shaft Rings / Knots -->
  <rect x="58" y="58" width="12" height="4" rx="2" fill="url(#keyGold)"/>
  <rect x="58" y="82" width="12" height="4" rx="2" fill="url(#keyGold)"/>

  <!-- Key Teeth / Bits (Ancient Maze Style) -->
  <path d="M68 88 L86 88 L86 96 L76 96 L76 100 L84 100 L84 106 L68 106 Z" fill="url(#keyGold)" stroke="#ca8a04" stroke-width="1" filter="url(#glow)"/>

  <!-- Sparkles -->
  <path d="M26 26 L29 34 L37 37 L29 40 L26 48 L23 40 L15 37 L23 34 Z" fill="#c084fc" filter="url(#glow)"/>
  <path d="M98 76 L100 82 L106 84 L100 86 L98 92 L96 86 L90 84 L96 82 Z" fill="#fef08a" filter="url(#glow)"/>
</svg>
