<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Морской Бой</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #E53935;
      --accent: #E53935;
      --bg-color: #121214;
      --card-bg: #18181A;
      --card-elevated: #222224;
      --text-main: #FFFFFF;
      --text-sec: rgba(255, 255, 255, 0.6);
      --water: #16202c;
      --water-hover: #223246;
      --ship: #334d70;
      --ship-preview: #4a6c98;
      --hit: #E53935;
      --miss: #55555e;
      --kill: #C62828;
      --valid: #33BD1C;
      --invalid: #E53935;
      --border-subtle: 0.5px solid rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 12px 10px;
      overflow-x: hidden;
    }
    
    .game-container {
      max-width: 400px;
      margin: 0 auto;
      padding: 0 4px;
    }
    
    .game-header {
      text-align: center;
      margin-bottom: 12px;
    }
    
    .game-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    
    .game-status {
      font-size: 0.85rem;
      color: var(--text-main);
      padding: 12px;
      background: var(--card-bg);
      border-radius: 14px;
      text-align: center;
      margin-bottom: 12px;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: var(--border-subtle);
      font-weight: 600;
    }
    
    .game-status.win {
      background: linear-gradient(145deg, rgba(51, 189, 28, 0.15), var(--card-bg));
      border: 1px solid var(--valid);
      color: var(--valid);
    }
    
    .game-status.lose {
      background: linear-gradient(145deg, rgba(229, 57, 53, 0.15), var(--card-bg));
      border: 1px solid var(--hit);
      color: var(--hit);
    }
    
    .game-status.enemy-turn {
      background: linear-gradient(145deg, rgba(255, 170, 0, 0.15), var(--card-bg));
      border: 1px solid #ffaa00;
      color: #ffaa00;
      animation: pulse-border 1s infinite;
    }
    
    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 5px rgba(255, 170, 0, 0.3); }
      50% { box-shadow: 0 0 15px rgba(255, 170, 0, 0.6); }
    }
    
    .board-container {
      margin-bottom: 16px;
    }
    
    .board-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-sec);
      margin-bottom: 8px;
      text-transform: uppercase;
      text-align: center;
    }
    
    .board {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 2px;
      background: var(--card-bg);
      padding: 6px;
      border-radius: 14px;
      border: var(--border-subtle);
    }
    
    .cell {
      aspect-ratio: 1;
      background: var(--water);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      position: relative;
    }
    
    .cell:active {
      transform: scale(0.9);
    }
    
    .cell.ship {
      background: var(--ship);
    }
    
    .cell.ship-preview {
      background: var(--ship-preview);
    }
    
    .cell.valid {
      background: var(--valid);
      animation: valid-pulse 0.5s infinite;
    }
    
    .cell.invalid {
      background: var(--invalid);
      opacity: 0.5;
    }
    
    @keyframes valid-pulse {
      0%, 100% { box-shadow: 0 0 5px rgba(51, 189, 28, 0.5); }
      50% { box-shadow: 0 0 12px rgba(51, 189, 28, 0.9); }
    }
    
    .cell.hit {
      background: var(--hit);
      animation: pulse 0.5s;
    }
    
    .cell.miss {
      background: var(--miss);
    }
    
    .cell.kill {
      background: var(--kill);
      animation: pulse 0.5s;
    }
    
    .cell.not-allowed {
      cursor: not-allowed;
    }
    
    .cell.enemy-target {
      animation: enemy-target-pulse 0.5s infinite;
      border: 2px solid #ffaa00;
    }
    
    @keyframes enemy-target-pulse {
      0%, 100% { box-shadow: 0 0 5px rgba(255, 170, 0, 0.5); }
      50% { box-shadow: 0 0 15px rgba(255, 170, 0, 0.9); }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    .enemy-board .cell.ship {
      background: var(--water);
    }
    
    .enemy-board .cell.hit::after {
      content: '✕';
      font-size: 0.8rem;
    }
    
    .enemy-board .cell.miss::after {
      content: '•';
      font-size: 1.2rem;
      color: var(--text-main);
    }
    
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    
    .btn {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
    }
    
    .btn:active {
      transform: scale(0.96);
    }
    
    .btn-primary {
      background: linear-gradient(180deg, #FF3B30 0%, #E53935 100%);
      color: white;
      box-shadow: 0 4px 16px rgba(229, 57, 53, 0.45);
    }
    
    .btn-secondary {
      background: var(--card-elevated);
      color: var(--text-main);
      border: var(--border-subtle);
    }
    
    .btn-success {
      background: linear-gradient(180deg, #FF3B30 0%, #E53935 100%);
      color: white;
      box-shadow: 0 4px 16px rgba(229, 57, 53, 0.45);
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .ship-selector {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      text-align: center;
      border: var(--border-subtle);
    }
    
    .ship-selector-title {
      font-size: 0.75rem;
      color: var(--text-sec);
      margin-bottom: 8px;
      text-transform: uppercase;
      font-weight: 600;
    }
    
    .ship-buttons {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .ship-btn {
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: var(--card-elevated);
      color: var(--text-main);
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    
    .ship-btn:hover {
      border-color: rgba(255,255,255,0.25);
    }
    
    .ship-btn.selected {
      background: #E53935;
      border-color: #FF3B30;
      box-shadow: 0 0 12px rgba(229, 57, 53, 0.5);
    }
    
    .ship-btn.placed {
      opacity: 0.3;
      border-color: transparent;
      cursor: not-allowed;
    }
    
    .rotate-btn {
      margin-top: 10px;
      padding: 9px 18px;
      background: var(--card-elevated);
      border: 1px solid rgba(229, 57, 53, 0.4);
      color: #fff;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
    
    .rotate-btn:active {
      transform: scale(0.96);
    }
    
    .reward-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: var(--card-bg);
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      z-index: 1000;
      border: 1px solid rgba(255, 215, 0, 0.3);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      max-width: 88%;
      width: 300px;
    }
    
    @keyframes popIn {
      to { transform: translate(-50%, -50%) scale(1); }
    }
    
    .reward-icon {
      font-size: 3rem;
      margin-bottom: 8px;
    }
    
    .reward-text {
      font-size: 1.3rem;
      font-weight: 800;
      color: #ffd700;
      margin-bottom: 6px;
    }
    
    .reward-amount {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ffd700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    .cone-icon {
      display: inline-block;
      width: 1.2em;
      height: 1.2em;
      vertical-align: -0.2em;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(255, 180, 0, 0.75));
    }
    
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 999;
      display: none;
    }
    
    .overlay.active {
      display: block;
    }
    
    .stats {
      display: flex;
      justify-content: space-around;
      padding: 10px;
      background: var(--card-bg);
      border-radius: 14px;
      margin-bottom: 12px;
      border: var(--border-subtle);
    }
    
    .stat-item {
      text-align: center;
    }
    
    .stat-value {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--primary);
    }
    
    .stat-label {
      font-size: 0.65rem;
      color: var(--text-sec);
      text-transform: uppercase;
      font-weight: 600;
    }
    
    .phase-indicator {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }
    
    .phase-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-sec);
    }
    
    .phase-dot.active {
      background: var(--primary);
      box-shadow: 0 0 10px var(--primary);
    }
    
    .phase-dot.completed {
      background: #00ff88;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="game-header">
      <div class="game-title">⚓ Морской Бой</div>
    </div>
    
    <div class="phase-indicator" id="phase-indicator">
      <div class="phase-dot active" id="phase-1"></div>
      <div class="phase-dot" id="phase-2"></div>
      <div class="phase-dot" id="phase-3"></div>
    </div>
    
    <div class="game-status" id="game-status">
      Расставьте корабли на поле
    </div>
    
    <!-- Экран расстановки -->
    <div id="placement-screen">
      <div class="ship-selector">
        <div class="ship-selector-title">Выберите корабль</div>
        <div class="ship-buttons" id="ship-buttons"></div>
        <button class="rotate-btn" onclick="toggleRotation()">🔄 Поворот: <span id="rotation-text">Горизонтально</span></button>
      </div>
      
      <div class="board-container">
        <div class="board-title">🚢 Ваше поле</div>
        <div class="board player-board" id="player-board"></div>
      </div>
      
      <div class="controls">
        <button class="btn btn-secondary" onclick="autoPlaceShips()">🎲 Авто</button>
        <button class="btn btn-success" id="start-btn" onclick="startGame()" disabled>▶️ Начать бой</button>
      </div>
    </div>
    
    <!-- Экран боя -->
    <div id="battle-screen" style="display: none;">
      <div class="stats">
        <div class="stat-item">
          <div class="stat-value" id="player-ships">10</div>
          <div class="stat-label">Кораблей</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="enemy-ships">10</div>
          <div class="stat-label">Врага</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="moves-count">0</div>
          <div class="stat-label">Ходов</div>
        </div>
      </div>
      
      <div class="board-container">
        <div class="board-title">🎯 Поле врага</div>
        <div class="board enemy-board" id="enemy-board"></div>
      </div>
      
      <div class="board-container">
        <div class="board-title">🚢 Ваше поле</div>
        <div class="board player-board" id="battle-player-board"></div>
      </div>
      
      <div class="controls">
        <button class="btn btn-secondary" onclick="resetGame()">🔄 Заново</button>
        <button class="btn btn-primary" onclick="closeGame()">✕ Выход</button>
      </div>
    </div>
  </div>
  
  <div class="overlay" id="overlay"></div>
  <div class="reward-popup" id="reward-popup" style="display: none;">
    <div class="reward-icon" id="popup-icon">🎉</div>
    <div class="reward-text" id="popup-title">Победа!</div>
    <div class="reward-amount" id="popup-amount">+100 <img src="cone.png" class="cone-icon" alt="🌰"></div>
    <button class="btn btn-primary" id="popup-btn" onclick="continueAfterWin()" style="margin-top: 20px;">▶️ Продолжить</button>
  </div>

<script>
  let lang = localStorage.getItem('rl_lang') || 'ru';
  const translations = {
    ru: {
      title: "⚓ Морской Бой", st: "Расставьте корабли на поле", sel: "Выберите корабль", rotH: "Горизонтально", rotV: "Вертикально",
      b1: "🚢 Ваше поле", b2: "🎯 Поле врага", btnA: "🎲 Авто", btnStart: "▶️ Начать бой", s1: "Кораблей", s2: "Врага", s3: "Ходов",
      btnR: "🔄 Заново", btnE: "✕ Выход", rotBtn: "🔄 Поворот: ",
      stBat: "🎯 Ваш ход! Стреляйте по полю врага", stHit: "🎯 Попадание! Стреляйте снова!", stKill: "💀 Корабль убит! Стреляйте снова!",
      stEnemy: "🤖 Ход противника...", stEnemyAim: "🤖 Противник прицеливается...", stEnemyKill: "💀 Корабль убит!", stEnemyHit: "💥 Попадание по вашему кораблю!", stEnemyMiss: "🎯 Промах! Ваш ход!",
      winAll: "🎉 ПОБЕДА! Все корабли врага уничтожены!", loseAll: "💀 ПОРАЖЕНИЕ! Ваши корабли уничтожены!",
      win: "Победа!", lose: "Поражение!", cont: "▶️ Продолжить", again: "🔄 Сыграть ещё", cones: "Шишек"
    },
    en: {
      title: "⚓ Battleship", st: "Place ships on the board", sel: "Select a ship", rotH: "Horizontal", rotV: "Vertical",
      b1: "🚢 Your board", b2: "🎯 Enemy board", btnA: "🎲 Auto", btnStart: "▶️ Start Battle", s1: "Ships", s2: "Enemy", s3: "Moves",
      btnR: "🔄 Restart", btnE: "✕ Exit", rotBtn: "🔄 Rotation: ",
      stBat: "🎯 Your turn! Fire at the enemy board", stHit: "🎯 Hit! Fire again!", stKill: "💀 Ship destroyed! Fire again!",
      stEnemy: "🤖 Enemy's turn...", stEnemyAim: "🤖 Enemy is aiming...", stEnemyKill: "💀 Ship destroyed!", stEnemyHit: "💥 Hit on your ship!", stEnemyMiss: "🎯 Miss! Your turn!",
      winAll: "🎉 VICTORY! All enemy ships destroyed!", loseAll: "💀 DEFEAT! All your ships destroyed!",
      win: "Victory!", lose: "Defeat!", cont: "▶️ Continue", again: "🔄 Play Again", cones: "Cones"
    }
  };
  let t = translations[lang] || translations.ru;

  function applyLang(selectedLang) {
    lang = selectedLang || 'ru';
    t = translations[lang] || translations.ru;
    const titleEl = document.querySelector('.game-title');
    if (titleEl) titleEl.innerText = t.title;
    const statusEl = document.getElementById('game-status');
    if (statusEl && gamePhase === 'placement') statusEl.innerText = t.st;
    const selEl = document.querySelector('.ship-selector-title');
    if (selEl) selEl.innerText = t.sel;
    const rotEl = document.getElementById('rotation-text');
    if (rotEl) {
      rotEl.parentElement.childNodes[0].nodeValue = t.rotBtn;
      rotEl.innerText = isHorizontal ? t.rotH : t.rotV;
    }
    const bTitles = document.querySelectorAll('.board-title');
    if (bTitles.length >= 3) {
      bTitles[0].innerText = t.b1;
      bTitles[1].innerText = t.b2;
      bTitles[2].innerText = t.b1;
    }
    const secBtns = document.querySelectorAll('.btn-secondary');
    if (secBtns.length >= 2) {
      secBtns[0].innerText = t.btnA;
      secBtns[1].innerText = t.btnR;
    }
    const startBtn = document.getElementById('start-btn');
    if (startBtn) startBtn.innerText = t.btnStart;
    const statLabels = document.querySelectorAll('.stat-label');
    if (statLabels.length >= 3) {
      statLabels[0].innerText = t.s1;
      statLabels[1].innerText = t.s2;
      statLabels[2].innerText = t.s3;
    }
    const primBtn = document.querySelector('.btn-primary');
    if (primBtn) primBtn.innerText = t.btnE;
  }

  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'language_changed') {
      applyLang(e.data.lang);
    }
  });

  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const BOARD_SIZE = 10;
  const SHIPS_CONFIG = [
    { size: 4, count: 1, id: 'ship-4' },
    { size: 3, count: 2, id: 'ship-3' },
    { size: 2, count: 3, id: 'ship-2' },
    { size: 1, count: 4, id: 'ship-1' }
  ];

  let playerBoard = [];
  let enemyBoard = [];
  let playerShips = [];
  let enemyShips = [];
  let playerHits = [];
  let enemyHits = [];
  let isPlayerTurn = true;
  let gameOver = false;
  let movesCount = 0;
  let userId = null;

  // Переменные для расстановки
  let selectedShipSize = null;
  let isHorizontal = true;
  let placedShips = { 1: 0, 2: 0, 3: 0, 4: 0 };
  let gamePhase = 'placement'; // placement, battle

  // Инициализация
  function init() {
    userId = getUserId();
    
    // Security логирование инициализации
    logSecurityEvent('GAME_INIT', 'Battleship game initialized', {
      user_id: userId,
      has_init_data: !!tg.initData,
      has_init_data_unsafe: !!tg.initDataUnsafe
    });
    
    applyLang(lang);

    createEmptyBoard();
    initShipSelector();
    renderPlacementBoard();
    updatePhaseIndicator();
  }

  function getUserId() {
    if (tg.initDataUnsafe?.user?.id) {
      return tg.initDataUnsafe.user.id;
    }
    if (tg.initData) {
      const urlParams = new URLSearchParams(tg.initData);
      const userStr = urlParams.get('user');
      if (userStr) {
        try {
          const user = JSON.parse(decodeURIComponent(userStr));
          return user.id;
        } catch (e) {
          logSecurityEvent('AUTH_ERROR', 'Failed to parse user data', { error: e.message });
        }
      }
    }
    return localStorage.getItem('rl_user_id');
  }

  // ==================== SECURITY MONITORING ====================
  const SECURITY_LOG_BUFFER = [];
  const MAX_BUFFER_SIZE = 50;
  const FLUSH_INTERVAL = 30000; // 30 секунд

  function logSecurityEvent(eventType, message, details = {}) {
    const logEntry = {
      timestamp: new Date().toISOString(),
      event_type: eventType,
      message: message,
      user_id: userId || null,
      game: 'battleship',
      details: details,
      page_url: window.location.href,
      user_agent: navigator.userAgent
    };

    console.log(`🔒 [SECURITY] ${eventType}: ${message}`, details);

    // Добавляем в буфер
    SECURITY_LOG_BUFFER.push(logEntry);

    // Ограничиваем размер буфера
    if (SECURITY_LOG_BUFFER.length > MAX_BUFFER_SIZE) {
      SECURITY_LOG_BUFFER.shift();
    }
  }

  function flushSecurityLogs() {
    if (SECURITY_LOG_BUFFER.length === 0) return;

    const logsToSend = [...SECURITY_LOG_BUFFER];
    SECURITY_LOG_BUFFER.length = 0;

    // Отправляем логи на сервер для SIEM
    fetch('/api/security/log', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Telegram-Init-Data': window.parent.Telegram?.WebApp?.initData || window.Telegram?.WebApp?.initData || ''
      },
      body: JSON.stringify({ logs: logsToSend }),
      keepalive: true
    })
    .then(r => {
      if (!r.ok) {
        console.warn('⚠️ Failed to send security logs to server');
      }
    })
    .catch(err => {
      console.warn('⚠️ Security log flush error:', err);
    });
  }

  // Периодическая отправка логов
  setInterval(flushSecurityLogs, FLUSH_INTERVAL);

  // Отправка логов при закрытии страницы
  window.addEventListener('beforeunload', flushSecurityLogs);

  function logGameAction(action, details = {}) {
    logSecurityEvent('GAME_ACTION', action, details);
  }

  function logApiError(endpoint, error, responseStatus) {
    logSecurityEvent('API_ERROR', `Error calling ${endpoint}`, {
      error: error?.message || error,
      status: responseStatus,
      endpoint: endpoint
    });
  }

  function logSuspiciousActivity(reason, details = {}) {
    logSecurityEvent('SUSPICIOUS_ACTIVITY', reason, details);
  }

  function createEmptyBoard() {
    playerBoard = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
    enemyBoard = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
    playerShips = [];
    enemyShips = [];
    playerHits = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(false));
    enemyHits = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(false));
  }

  function initShipSelector() {
    const container = document.getElementById('ship-buttons');
    container.innerHTML = '';
    
    SHIPS_CONFIG.forEach(ship => {
      for (let i = 0; i < ship.count; i++) {
        const btn = document.createElement('button');
        btn.className = 'ship-btn';
        btn.textContent = '🚢'.repeat(ship.size);
        btn.dataset.size = ship.size;
        btn.dataset.index = i;
        btn.onclick = () => selectShip(ship.size, i);
        container.appendChild(btn);
      }
    });
  }

  function selectShip(size, index) {
    if (placedShips[size] >= SHIPS_CONFIG.find(s => s.size === size).count) {
      return; // Корабль уже размещён
    }
    
    selectedShipSize = size;
    
    // Обновляем выделение
    document.querySelectorAll('.ship-btn').forEach(btn => {
      btn.classList.remove('selected');
      if (parseInt(btn.dataset.size) === size && parseInt(btn.dataset.index) === index) {
        btn.classList.add('selected');
      }
    });
    
    renderPlacementBoard();
  }

  function toggleRotation() {
    isHorizontal = !isHorizontal;
    document.getElementById('rotation-text').textContent = isHorizontal ? t.rotH : t.rotV;
    renderPlacementBoard();
  }

  function renderPlacementBoard() {
    const board = document.getElementById('player-board');
    board.innerHTML = '';
    
    for (let row = 0; row < BOARD_SIZE; row++) {
      for (let col = 0; col < BOARD_SIZE; col++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        
        // Отображаем размещённые корабли
        if (playerBoard[row][col] === 1) {
          cell.classList.add('ship');
        }
        
        // Показываем превью при наведении
        if (selectedShipSize) {
          cell.onmouseenter = () => showShipPreview(row, col);
          cell.onmouseleave = () => clearShipPreview();
          cell.onclick = () => placeShipAt(row, col);
          
          // Показываем валидность размещения
          if (canPlaceShip(playerBoard, row, col, selectedShipSize, isHorizontal, true)) {
            cell.classList.add('valid');
          } else {
            cell.classList.add('invalid');
          }
        }
        
        board.appendChild(cell);
      }
    }
  }

  function showShipPreview(row, col) {
    if (!selectedShipSize) return;
    
    for (let i = 0; i < selectedShipSize; i++) {
      const r = isHorizontal ? row : row + i;
      const c = isHorizontal ? col + i : col;
      
      if (r < BOARD_SIZE && c < BOARD_SIZE) {
        const index = r * BOARD_SIZE + c;
        const board = document.getElementById('player-board');
        if (board.children[index]) {
          board.children[index].classList.add('ship-preview');
        }
      }
    }
  }

  function clearShipPreview() {
    document.querySelectorAll('.ship-preview').forEach(cell => {
      cell.classList.remove('ship-preview');
    });
  }

  function placeShipAt(row, col) {
    if (!selectedShipSize) return;
    
    if (!canPlaceShip(playerBoard, row, col, selectedShipSize, isHorizontal, true)) {
      return;
    }
    
    // Размещаем корабль
    const ship = [];
    for (let i = 0; i < selectedShipSize; i++) {
      const r = isHorizontal ? row : row + i;
      const c = isHorizontal ? col + i : col;
      playerBoard[r][c] = 1;
      ship.push({ row: r, col: c });
    }
    playerShips.push(ship);
    
    // Обновляем счётчик
    placedShips[selectedShipSize]++;
    
    // Помечаем кнопку как размещённую
    const btnIndex = getShipButtonIndex(selectedShipSize, placedShips[selectedShipSize] - 1);
    const buttons = document.querySelectorAll('.ship-btn');
    if (buttons[btnIndex]) {
      buttons[btnIndex].classList.add('placed');
    }
    
    // Сбрасываем выбор
    selectedShipSize = null;
    document.querySelectorAll('.ship-btn').forEach(btn => btn.classList.remove('selected'));
    
    // Проверяем, все ли корабли размещены
    checkAllShipsPlaced();
    
    renderPlacementBoard();
  }

  function getShipButtonIndex(size, placedCount) {
    let index = 0;
    for (const ship of SHIPS_CONFIG) {
      if (ship.size === size) {
        return index + placedCount;
      }
      index += ship.count;
    }
    return 0;
  }

  function canPlaceShip(board, row, col, size, horizontal, checkNeighbors) {
    for (let i = 0; i < size; i++) {
      const r = horizontal ? row : row + i;
      const c = horizontal ? col + i : col;
      
      if (r >= BOARD_SIZE || c >= BOARD_SIZE) return false;
      if (board[r][c] === 1) return false;
      
      if (checkNeighbors) {
        // Проверка соседних клеток
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
              if (board[nr][nc] === 1) return false;
            }
          }
        }
      }
    }
    return true;
  }

  function checkAllShipsPlaced() {
    const totalShips = SHIPS_CONFIG.reduce((sum, s) => sum + s.count, 0);
    const placedTotal = Object.values(placedShips).reduce((sum, c) => sum + c, 0);
    
    const startBtn = document.getElementById('start-btn');
    if (placedTotal >= totalShips) {
      startBtn.disabled = false;
      document.getElementById('game-status').textContent = lang === 'ru' ? '✅ Все корабли размещены! Нажмите "Начать бой"' : '✅ All ships placed! Press "Start Battle"';
    }
  }

  function autoPlaceShips() {
    // Очищаем поле
    playerBoard = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
    playerShips = [];
    placedShips = { 1: 0, 2: 0, 3: 0, 4: 0 };
    
    // Размещаем все корабли
    SHIPS_CONFIG.forEach(ship => {
      for (let i = 0; i < ship.count; i++) {
        placeRandomShip(ship.size);
      }
    });
    
    // Помечаем все кнопки как размещённые
    document.querySelectorAll('.ship-btn').forEach(btn => {
      btn.classList.add('placed');
    });
    selectedShipSize = null;
    
    checkAllShipsPlaced();
    renderPlacementBoard();
  }

  function placeRandomShip(size) {
    let placed = false;
    while (!placed) {
      const horizontal = Math.random() < 0.5;
      const row = Math.floor(Math.random() * BOARD_SIZE);
      const col = Math.floor(Math.random() * BOARD_SIZE);
      
      if (canPlaceShip(playerBoard, row, col, size, horizontal, true)) {
        const ship = [];
        for (let i = 0; i < size; i++) {
          const r = horizontal ? row : row + i;
          const c = horizontal ? col + i : col;
          playerBoard[r][c] = 1;
          ship.push({ row: r, col: c });
        }
        playerShips.push(ship);
        placedShips[size]++;
        placed = true;
      }
    }
  }

  function startGame() {
    gamePhase = 'battle';
    
    // Скрываем экран расстановки, показываем экран боя
    document.getElementById('placement-screen').style.display = 'none';
    document.getElementById('battle-screen').style.display = 'block';
    
    // Генерируем поле врага
    generateEnemyBoard();
    
    // Обновляем индикатор фазы
    updatePhaseIndicator();
    
    // Настраиваем UI для боя
    document.getElementById('game-status').textContent = t.stBat;
    document.getElementById('game-status').className = 'game-status';
    
    renderBattleBoards();
    updateStats();
  }

  function generateEnemyBoard() {
    SHIPS_CONFIG.forEach(ship => {
      for (let i = 0; i < ship.count; i++) {
        placeRandomEnemyShip(ship.size);
      }
    });
  }

  function placeRandomEnemyShip(size) {
    let placed = false;
    while (!placed) {
      const horizontal = Math.random() < 0.5;
      const row = Math.floor(Math.random() * BOARD_SIZE);
      const col = Math.floor(Math.random() * BOARD_SIZE);
      
      if (canPlaceShip(enemyBoard, row, col, size, horizontal, true)) {
        const ship = [];
        for (let i = 0; i < size; i++) {
          const r = horizontal ? row : row + i;
          const c = horizontal ? col + i : col;
          enemyBoard[r][c] = 1;
          ship.push({ row: r, col: c });
        }
        enemyShips.push(ship);
        placed = true;
      }
    }
  }

  function renderBattleBoards() {
    renderBattlePlayerBoard();
    renderEnemyBoard();
  }

  function renderBattlePlayerBoard() {
    const board = document.getElementById('battle-player-board');
    board.innerHTML = '';
    
    for (let row = 0; row < BOARD_SIZE; row++) {
      for (let col = 0; col < BOARD_SIZE; col++) {
        const cell = document.createElement('div');
        cell.className = 'cell not-allowed';
        
        if (playerBoard[row][col] === 1) {
          cell.classList.add('ship');
        }
        
        if (playerHits[row][col]) {
          if (playerBoard[row][col] === 1) {
            cell.classList.add('kill');
          } else {
            cell.classList.add('miss');
          }
        }
        
        board.appendChild(cell);
      }
    }
  }

  function renderEnemyBoard() {
    const board = document.getElementById('enemy-board');
    board.innerHTML = '';
    
    for (let row = 0; row < BOARD_SIZE; row++) {
      for (let col = 0; col < BOARD_SIZE; col++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        
        if (enemyHits[row][col]) {
          if (enemyBoard[row][col] === 1) {
            cell.classList.add('kill');
          } else {
            cell.classList.add('miss');
          }
        } else if (isPlayerTurn && !gameOver) {
          cell.onclick = () => playerShoot(row, col);
        } else {
          cell.classList.add('not-allowed');
        }
        
        board.appendChild(cell);
      }
    }
  }

  function playerShoot(row, col) {
    if (gameOver || !isPlayerTurn || enemyHits[row][col]) return;

    enemyHits[row][col] = true;
    movesCount++;

    const hit = enemyBoard[row][col] === 1;

    // Проверяем, убит ли корабль
    const killedShip = checkShipKilled(row, col, enemyShips, enemyHits);
    
    // Если корабль убит, открываем клетки вокруг
    if (killedShip) {
      markAroundKilledShip(killedShip, enemyHits);
    }

    if (hit) {
      updateStats();
      renderEnemyBoard();

      if (checkWin(enemyShips, enemyHits)) {
        gameOver = true;
        renderEnemyBoard();
        showWin();
        return;
      }

      // Стреляем снова при попадании
      document.getElementById('game-status').textContent = killedShip ? t.stKill : t.stHit;
    } else {
      isPlayerTurn = false;
      updateStats();
      renderEnemyBoard();
      document.getElementById('game-status').textContent = t.stEnemy;

      setTimeout(enemyTurn, 500);
    }
  }

  function enemyTurn() {
    if (gameOver) return;
    
    const status = document.getElementById('game-status');
    status.textContent = t.stEnemyAim;
    status.className = 'game-status enemy-turn';

    // Простой ИИ: ищет раненые корабли, иначе стреляет случайно
    let target = findDamagedShip();

    if (!target) {
      do {
        target = {
          row: Math.floor(Math.random() * BOARD_SIZE),
          col: Math.floor(Math.random() * BOARD_SIZE)
        };
      } while (playerHits[target.row][target.col]);
    }
    
    // Показываем куда целится враг
    highlightEnemyTarget(target.row, target.col);
    
    setTimeout(() => {
      // Убираем подсветку
      clearEnemyTarget();
      
      const hit = playerBoard[target.row][target.col] === 1;
      playerHits[target.row][target.col] = true;
      movesCount++;
      
      // Проверяем, убит ли корабль
      const killedShip = checkShipKilled(target.row, target.col, playerShips, playerHits);
      
      // Если корабль убит, открываем клетки вокруг
      if (killedShip) {
        markAroundKilledShip(killedShip, playerHits);
      }
      
      renderBattlePlayerBoard();
      updateStats();
      
      if (hit) {
        status.textContent = killedShip ? t.stEnemyKill : t.stEnemyHit;
        
        if (checkWin(playerShips, playerHits)) {
          gameOver = true;
          status.textContent = t.loseAll;
          status.className = 'game-status lose';
          return;
        }
        
        // ИИ стреляет снова при попадании
        setTimeout(enemyTurn, 800);
      } else {
        status.textContent = t.stEnemyMiss;
        setTimeout(() => {
          isPlayerTurn = true;
          status.textContent = t.stBat;
          status.className = 'game-status';
          renderEnemyBoard();
        }, 500);
      }
    }, 1000);
  }
  
  function highlightEnemyTarget(row, col) {
    const board = document.getElementById('battle-player-board');
    const index = row * BOARD_SIZE + col;
    if (board.children[index]) {
      board.children[index].classList.add('enemy-target');
    }
  }
  
  function clearEnemyTarget() {
    const board = document.getElementById('battle-player-board');
    for (let cell of board.children) {
      cell.classList.remove('enemy-target');
    }
  }

  // Проверяет, убит ли корабль в данной клетке
  function checkShipKilled(row, col, ships, hits) {
    for (const ship of ships) {
      // Проверяем, есть ли эта клетка в корабле
      const inShip = ship.some(segment => segment.row === row && segment.col === col);
      if (inShip) {
        // Проверяем, все ли клетки корабля подбиты
        const allHit = ship.every(segment => hits[segment.row][segment.col]);
        if (allHit) {
          return ship; // Возвращаем убитый корабль
        }
      }
    }
    return null;
  }

  // Помечает промахами все клетки вокруг убитого корабля
  function markAroundKilledShip(ship, hits) {
    for (const segment of ship) {
      // Проверяем все соседние клетки (3x3)
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = segment.row + dr;
          const nc = segment.col + dc;
          
          // Если клетка в пределах поля и ещё не отмечена
          if (nr >= 0 && nr < BOARD_SIZE && 
              nc >= 0 && nc < BOARD_SIZE && 
              !hits[nr][nc]) {
            hits[nr][nc] = true; // Помечаем как промах
          }
        }
      }
    }
  }

  function findDamagedShip() {
    for (let row = 0; row < BOARD_SIZE; row++) {
      for (let col = 0; col < BOARD_SIZE; col++) {
        if (playerHits[row][col] && playerBoard[row][col] === 1) {
          // Проверяем соседей
          const neighbors = [
            { row: row - 1, col },
            { row: row + 1, col },
            { row, col: col - 1 },
            { row, col: col + 1 }
          ];
          
          for (const n of neighbors) {
            if (n.row >= 0 && n.row < BOARD_SIZE && 
                n.col >= 0 && n.col < BOARD_SIZE && 
                !playerHits[n.row][n.col]) {
              return n;
            }
          }
        }
      }
    }
    return null;
  }

  function checkWin(ships, hits) {
    for (const ship of ships) {
      for (const segment of ship) {
        if (!hits[segment.row][segment.col]) {
          return false;
        }
      }
    }
    return true;
  }

  function updateStats() {
    const playerAlive = countAliveShips(playerShips, playerHits);
    const enemyAlive = countAliveShips(enemyShips, enemyHits);
    
    document.getElementById('player-ships').textContent = playerAlive;
    document.getElementById('enemy-ships').textContent = enemyAlive;
    document.getElementById('moves-count').textContent = movesCount;
  }

  function countAliveShips(ships, hits) {
    let alive = 0;
    for (const ship of ships) {
      const allHit = ship.every(s => hits[s.row][s.col]);
      if (!allHit) alive++;
    }
    return alive;
  }

  function updatePhaseIndicator() {
    const phase1 = document.getElementById('phase-1');
    const phase2 = document.getElementById('phase-2');
    
    if (gamePhase === 'placement') {
      phase1.classList.add('active');
      phase2.classList.remove('active', 'completed');
    } else if (gamePhase === 'battle') {
      phase1.classList.remove('active');
      phase1.classList.add('completed');
      phase2.classList.add('active');
    }
  }

  function showWin() {
    const status = document.getElementById('game-status');
    status.textContent = t.winAll;
    status.className = 'game-status win';
    
    showPopupResult(true);
    
    // Отправляем данные о победе (100 шишек)
    earnTokens(100, 'battleship_win');
  }

  function showLose() {
    const status = document.getElementById('game-status');
    status.textContent = t.loseAll;
    status.className = 'game-status lose';
    showPopupResult(false);
  }

  function showPopupResult(isWin) {
    const popup = document.getElementById('reward-popup');
    const icon = document.getElementById('popup-icon');
    const title = document.getElementById('popup-title');
    const amount = document.getElementById('popup-amount');
    const btn = document.getElementById('popup-btn');
    
    if (isWin) {
      icon.innerText = '🎉';
      title.innerText = t.win;
      title.style.color = '#ffd700';
      amount.style.display = 'flex';
      amount.innerHTML = '+100 <img src="cone.png" class="cone-icon" alt="🌰">';
      popup.style.borderColor = '#ffd700';
      btn.innerText = t.cont;
    } else {
      icon.innerText = '💀';
      title.innerText = t.lose;
      title.style.color = 'var(--hit)';
      amount.style.display = 'none';
      popup.style.borderColor = 'var(--hit)';
      btn.innerText = t.again;
    }
    
    document.getElementById('overlay').classList.add('active');
    popup.style.display = 'block';
  }

  function earnTokens(amount, reason) {
    if (!userId) {
      logSuspiciousActivity('earnTokens without userId', { amount: amount, reason: reason });
      return;
    }

    logGameAction('TOKEN_EARN_REQUEST', { amount: amount, reason: reason });

    const data = {
      userId: userId
    };

    fetch('/api/game/battleship', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Telegram-Init-Data': window.parent.Telegram?.WebApp?.initData || window.Telegram?.WebApp?.initData || ''
      },
      body: JSON.stringify(data)
    })
    .then(r => {
      if (!r.ok) {
        logApiError('/api/game/battleship', `HTTP ${r.status}`, r.status);
        throw new Error(`HTTP ${r.status}`);
      }
      return r.json();
    })
    .then(result => {
      if (result.status === 'ok') {
        logGameAction('GAME_WIN_REPORTED', { win: true, game: 'battleship' });
        window.parent.postMessage({ type: 'game_complete', game: 'battleship', win: true }, window.location.origin);
      } else {
        logApiError('/api/game/battleship', result.error || 'Unknown error', null);
      }
    })
    .catch(err => {
      logApiError('/api/game/battleship', err, null);
      console.error('❌ Error:', err);
    });
  }

  function resetGame() {
    gamePhase = 'placement';
    gameOver = false;
    isPlayerTurn = true;
    movesCount = 0;
    selectedShipSize = null;
    placedShips = { 1: 0, 2: 0, 3: 0, 4: 0 };
    
    document.getElementById('game-status').textContent = t.st;
    document.getElementById('game-status').className = 'game-status';
    document.getElementById('overlay').classList.remove('active');
    document.getElementById('reward-popup').style.display = 'none';
    document.getElementById('placement-screen').style.display = 'block';
    document.getElementById('battle-screen').style.display = 'none';
    
    // Сбрасываем кнопки кораблей
    document.querySelectorAll('.ship-btn').forEach(btn => {
      btn.classList.remove('placed', 'selected');
    });
    
    createEmptyBoard();
    initShipSelector();
    renderPlacementBoard();
    updatePhaseIndicator();
  }

  function closeGame() {
    tg.close();
  }

  function closeReward() {
    document.getElementById('overlay').classList.remove('active');
    document.getElementById('reward-popup').style.display = 'none';
  }

  function continueAfterWin() {
    closeReward();
    resetGame();
  }

  // Запуск игры
  init();
</script>
</body>
</html>
